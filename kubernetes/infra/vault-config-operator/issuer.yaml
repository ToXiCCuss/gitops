# Self-signed Issuer for the webhook and metrics certificates of the vault-config-operator chart (the chart expects the
# name selfsigned-issuer). The folder lies beside helm/ and kubectl/ on purpose, see infra/helm/vault-config-operator.yaml.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: vault-config-operator
spec:
  selfSigned: {}
