apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: netbird
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: ghcr.io/netbirdio/helm-charts
    targetRevision: 0.8.0
    chart: netbird-operator
    plugin:
      env:
        - name: HELM_VALUES
          value: |
            operator:
              resources:
                requests:
                  cpu: "0"
                  memory: "0Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# netbird-mgmt-api-key comes from Vault via AVP - see kubernetes/secrets/netbird-mgmt-api-key.yaml.
