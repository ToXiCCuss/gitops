# argocd: https://argocd.k8sdev.rjst.de -> argocd-server.argocd:80
# Own Gateway/Service/listener/NetBird resource per app - see kube-istio-internal.yaml.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: internal-gateway
  servers:
    - port:
        number: 8444
        name: https-argocd
        protocol: HTTPS
      hosts:
        - argocd.k8sdev.rjst.de
      tls:
        mode: SIMPLE
        credentialName: k8sdev-wildcard-tls

---

apiVersion: v1
kind: Service
metadata:
  name: gw-argocd
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: internal-gateway
    istio: internal-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8444

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
    - argocd.k8sdev.rjst.de
  gateways:
    - argocd
  http:
    - route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 80

---

apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: gw-argocd
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  networkRouterRef:
    name: proxy
    namespace: netbird
  serviceRef:
    name: gw-argocd
  groups:
    - name: k8s-argocd
    - name: kubernetes-services
