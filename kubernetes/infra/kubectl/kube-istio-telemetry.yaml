# Needs the extension provider "tempo" from istio/istio-operator.yaml (istioctl install), otherwise istiod
# rejects the provider name. Root namespace = applies to the whole mesh.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-tracing
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  tracing:
    - providers:
        - name: tempo
      randomSamplingPercentage: 100

---
# Needs the extension provider "access-json" from istio/istio-operator.yaml (istioctl install), same order as for "tempo".
# Only the public gateway writes an access log. Tracing stays as set in the root namespace above.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: gateway-access-log
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  accessLogging:
    - providers:
        - name: access-json
