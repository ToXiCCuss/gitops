# Vault configuration as resources, applied by the vault-config-operator (infra/helm/vault-config-operator.yaml).
# The operator logs in with the token of the ServiceAccount named in spec.authentication and the Vault role vault-config,
# which is created once by hand (docs/vault.md: Vault Config Operator).
#
# Removing a resource from this file removes it in Vault. argocd is the login of the AVP plugin of Argo CD: without it no Secret
# renders any more (a missing Secret does not fail the sync). jenkins is the login of every pipeline. The AppRoles docker01 and
# dbadmin are the logins of the Docker host (deploy.sh) and of the database scripts; a role that is removed and created again
# invalidates the secret_ids of the hosts.
#
# Deliberately not here: the KV engines and the auth methods (removing one deletes everything below it), the config of the
# kubernetes auth method, the secret_ids, and the group aliases of the Keycloak login. The rest of that login (config, role,
# policies, groups) is in kube-vault-config-oidc.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-config
  namespace: vault

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: argocd
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "argocd/data/*" {
      capabilities = ["read"]
    }

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: argocd
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: kubernetes
  policies:
    - argocd
  targetNamespaces:
    targetNamespaces:
      - argocd
  targetServiceAccounts:
    - argocd-repo-server
  audience: https://kubernetes.default.svc.cluster.local
  tokenTTL: 86400

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: jenkins
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "jenkins/data/*" {
      capabilities = ["read"]
    }

---

# The pods of a pipeline log in with default; the pod that deploys runs as helm-deployer (kubernetes/cicd/kubectl/helm-deployer.yaml)
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: jenkins
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: kubernetes
  policies:
    - jenkins
  targetNamespaces:
    targetNamespaces:
      - jenkins
  targetServiceAccounts:
    - default
    - helm-deployer
  audience: https://kubernetes.default.svc.cluster.local
  tokenTTL: 86400

---

# Read-only on the secrets of the Docker projects (deploy.sh)
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: docker
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "docker/data/*" {
      capabilities = ["read"]
    }

---

# What setup-rustfs.sh writes besides reading: new S3 keys (create only: an existing key is never overwritten) and the keys of an
# app in its own secret (patch merges them into the secret, so the other keys stay; create only when the secret does not exist).
# The host cannot read dev/ or prod/. A new app with S3 keys: add its path here and "vaultCopy" in docker/rustfs/identities.json
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: docker-s3-keys
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "docker/data/s3/*" {
      capabilities = ["create"]
    }
    path "dev/data/er-launcher-service" {
      capabilities = ["create", "patch"]
    }
    path "prod/data/er-launcher-service" {
      capabilities = ["create", "patch"]
    }

---

# Not bound to an address: Vault runs in the cluster and sees the address of a pod, a CIDR binding makes every login fail
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AppRoleAuthEngineRole
metadata:
  name: docker01
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: approle
  tokenPolicies:
    - docker
    - docker-s3-keys
  tokenTTL: 5m
  tokenMaxTTL: 10m

---

# Write and delete, no read: the database host can store and remove a password but not read one back
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: databases-write
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "databases/data/*" {
      capabilities = ["create", "update"]
    }
    # The delete scripts remove the entry of a dropped login with all its versions (KV v2 metadata delete)
    path "databases/metadata/*" {
      capabilities = ["delete"]
    }

---

# Like docker01 not bound to an address
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AppRoleAuthEngineRole
metadata:
  name: dbadmin
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: approle
  tokenPolicies:
    - databases-write
  tokenTTL: 5m
  tokenMaxTTL: 10m

---

# Only the Raft snapshot, for the periodic token of docker/vault-backup. The name in Vault has an underscore, which a Kubernetes
# object name cannot have: spec.name is the name in Vault
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: vault-snapshot
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  name: vault_snapshot
  type: acl
  policy: |
    path "sys/storage/raft/snapshot" {
      capabilities = ["read"]
    }

---

# Read-only on the secrets of the Spring apps in dev. Nothing reads them yet, the apps are wired up app by app later.
# The names in Vault have an underscore, which a Kubernetes object name cannot have: spec.name is the name in Vault
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: spring-dev
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  name: spring_dev
  type: acl
  policy: |
    path "dev/data/*" {
      capabilities = ["read"]
    }

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: spring-dev
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  name: spring_dev
  path: kubernetes
  policies:
    - spring_dev
  targetNamespaces:
    targetNamespaces:
      - dev
  targetServiceAccounts:
    - spring
  audience: https://kubernetes.default.svc.cluster.local
  tokenTTL: 86400

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: spring-prod
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  name: spring_prod
  type: acl
  policy: |
    path "prod/data/*" {
      capabilities = ["read"]
    }

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: spring-prod
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  name: spring_prod
  path: kubernetes
  policies:
    - spring_prod
  targetNamespaces:
    targetNamespaces:
      - prod
  targetServiceAccounts:
    - spring
  audience: https://kubernetes.default.svc.cluster.local
  tokenTTL: 86400
