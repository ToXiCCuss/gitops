# Vault configuration as resources, applied by the vault-config-operator (infra/helm/vault-config-operator.yaml).
# The operator logs in with the token of the ServiceAccount named in spec.authentication and the Vault role vault-config,
# which is created once by hand (README: Vault Config Operator).
#
# Removing a resource from this file removes it in Vault. argocd is the login of the AVP plugin of Argo CD: without it no Secret
# renders any more (a missing Secret does not fail the sync). jenkins is the login of every pipeline.
#
# Deliberately not here: the KV engines (removing an engine deletes its secrets) and the config of the kubernetes auth method.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-config
  namespace: vault

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: argocd
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "argocd/data/*" {
      capabilities = ["read"]
    }

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: argocd
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: kubernetes
  policies:
    - argocd
  targetNamespaces:
    targetNamespaces:
      - argocd
  targetServiceAccounts:
    - argocd-repo-server
  audience: https://kubernetes.default.svc.cluster.local
  tokenTTL: 86400

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: jenkins
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "jenkins/data/*" {
      capabilities = ["read"]
    }

---

# The pods of a pipeline log in with default; the pod that deploys runs as helm-deployer (kubernetes/cicd/kubectl/helm-deployer.yaml)
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: jenkins
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: kubernetes
  policies:
    - jenkins
  targetNamespaces:
    targetNamespaces:
      - jenkins
  targetServiceAccounts:
    - default
    - helm-deployer
  audience: https://kubernetes.default.svc.cluster.local
  tokenTTL: 86400
