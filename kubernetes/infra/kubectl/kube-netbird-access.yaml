# NetBird groups. The access policies between them are created by hand in the
# dashboard (the operator writes none, NetBird is deny-by-default) - see
# kubernetes/README.adoc, section 5.
#
#   k8s-admins          peers/users that may reach every app (policy -> kubernetes-services)
#   kubernetes-services every NetworkResource is in this group
#   k8s-<app>           destination group of one app's NetworkResource
#   <app>-users         peers/users that may reach only that app (policy -> k8s-<app>)
#
# Only the groups of what is deployed with `infra` live here (vault, argocd). Every
# other app declares its own two groups next to its NetworkResource, so they are
# created when that app's domain is deployed and removed with it.
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: kubernetes-services
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: kubernetes-services

---

# Formerly "kubernetes-clients". metadata.name stays, so the operator renames the
# existing NetBird group in place (same ID: peers, policies and the zone's
# distribution group keep working).
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: kubernetes-clients
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-admins

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-vault
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-vault

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: vault-users
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: vault-users

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-argocd
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-argocd

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: argocd-users
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: argocd-users
