# NetBird groups. The access policy between them is created by hand in the
# dashboard (the operator writes none, NetBird is deny-by-default) - see
# README.md, Kubernetes > Deployment Guide > NetBird configuration.
#
#   k8s-users           peers/users that may reach every app (policy -> kubernetes-services)
#   kubernetes-services every NetworkResource is in this group
#   k8s-<app>           group of one app's NetworkResource
#
# Only the groups of what is deployed with `infra` live here (vault, argocd). Every
# other app declares its own group next to its NetworkResource, so it is created
# when that app's domain is deployed and removed with it.
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: kubernetes-services
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: kubernetes-services

---

# Formerly "kubernetes-clients", then "k8s-admins". metadata.name stays, so the operator
# renames the existing NetBird group in place (same ID: peers, policies and the zone's
# distribution group keep working).
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: kubernetes-clients
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-users

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-vault
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-vault

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-argocd
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-argocd
