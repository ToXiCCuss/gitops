apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: proxy
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  dnsZoneRef:
    name: k8sdev.rjst.de
  workloadOverride:
    # CRD default is 3; the cluster has a single node for now. Raise it (3+ gives failover) once there are more nodes.
    replicas: 1
