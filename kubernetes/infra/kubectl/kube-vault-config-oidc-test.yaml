# Test of the Keycloak login (OIDC) with the vault-config-operator, on a second auth mount oidc-test beside the real one (auth/oidc).
# It copies the real config, role and groups, but the group admin is called oidc-test-admin and carries the harmless policy
# oidc-test. Log in with: vault login -method=oidc -path=oidc-test. Remove this file once the real login has been taken over
# (the mount and everything below it go with it).
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AuthEngineMount
metadata:
  name: oidc-test
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: oidc
  description: Test of the vault-config-operator

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineConfig
metadata:
  name: oidc-test
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: oidc-test
  OIDCDiscoveryURL: https://auth.proxy.rjst.de/realms/rjst
  OIDCClientID: vault
  OIDCCredentials:
    secret:
      name: vault-oidc
    passwordKey: clientSecret
  defaultRole: default

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: oidc-test
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  path: oidc-test
  name: default
  roleType: oidc
  userClaim: preferred_username
  groupsClaim: roles
  boundClaims:
    roles:
      - admin
      - developer
  allowedRedirectURIs:
    - https://vault.k8sdev.rjst.de/ui/vault/auth/oidc-test/oidc/callback
    - http://localhost:8250/oidc/callback
  OIDCScopes:
    - openid
    - profile
    - email
  tokenTTL: 8h

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: oidc-test
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: acl
  policy: |
    path "sys/health" {
      capabilities = ["read"]
    }

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: Group
metadata:
  name: oidc-test-admin
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  type: external
  policies:
    - oidc-test

---

# The alias name is the value of the claim roles in the token, as in the real login (alias admin on the mount oidc)
apiVersion: redhatcop.redhat.io/v1alpha1
kind: GroupAlias
metadata:
  name: oidc-test-admin
  namespace: vault
spec:
  authentication:
    path: kubernetes
    role: vault-config
    serviceAccount:
      name: vault-config
  authEngineMountPath: oidc-test
  groupName: oidc-test-admin
  name: admin
