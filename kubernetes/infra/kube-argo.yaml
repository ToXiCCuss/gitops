apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  networkRouterRef:
    name: proxy
    namespace: netbird
  serviceRef:
    name: argocd-server
  groups:
    - name: kubernetes-services
