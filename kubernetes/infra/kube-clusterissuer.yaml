apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  namespace: cert-manager
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  acme:
    email: robert.stenzhorn@web.de
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt
    solvers:
      - dns01:
          webhook:
            groupName: acme.hetzner.com
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: hetzner-secret
                key: api-token

---

apiVersion: v1
kind: Secret
metadata:
  name: hetzner-secret
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    avp.kubernetes.io/path: "argocd/data/ca"
type: Opaque
stringData:
  api-token: <hetzner.token>
