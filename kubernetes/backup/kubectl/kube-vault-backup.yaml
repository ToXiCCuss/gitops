apiVersion: v1
kind: Namespace
metadata:
  name: backup

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-backup-sa
  namespace: backup

---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: vault-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: vault-backup
              image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
              env:
                - name: VAULT_ADDR
                  value: "http://vault.vault.svc.cluster.local:8200"
              resources:
                requests:
                  cpu: "0"
                  memory: "0Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                - name: vault-token
                  mountPath: /var/run/secrets/vault
                  readOnly: true
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl jq restic rclone >/dev/null

                  JWT=$(cat /var/run/secrets/vault/token)
                  VAULT_TOKEN=$(curl -sf --request POST \
                    --data "{\"jwt\": \"$JWT\", \"role\": \"vault_backup\"}" \
                    "$VAULT_ADDR/v1/auth/kubernetes/login" | jq -r '.auth.client_token')

                  SECRET=$(curl -sf --header "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/backup/data/vault-backup")
                  echo "$SECRET" | jq -r '.data.data.restic_password' > /tmp/restic-password
                  mkdir -p /root/.config/rclone
                  echo "$SECRET" | jq -r '.data.data.rclone_conf' > /root/.config/rclone/rclone.conf

                  export RESTIC_REPOSITORY="rclone:pCloud:/Backups/vault_pb"
                  export RESTIC_PASSWORD_FILE="/tmp/restic-password"
                  restic snapshots >/dev/null 2>&1 || restic init

                  SNAP="/tmp/vault-snapshot-$(date +%Y%m%d-%H%M%S).snap"
                  curl -sf --header "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/sys/storage/raft/snapshot" -o "$SNAP"

                  restic backup --tag vault-k8s "$SNAP"

                  rm -f "$SNAP" /tmp/restic-password
                  echo "Vault backup completed successfully."
          volumes:
            - name: vault-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: "https://kubernetes.default.svc.cluster.local"
                      expirationSeconds: 600
