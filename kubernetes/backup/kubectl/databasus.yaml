# databasus: https://databasus.k8sdev.rjst.de -> databasus-service.databasus:4005
# Own Gateway/Service/listener/NetBird resource per app - see kube-istio-internal.yaml.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: databasus
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: internal-gateway
  servers:
    - port:
        number: 8451
        name: https-databasus
        protocol: HTTPS
      hosts:
        - databasus.k8sdev.rjst.de
      tls:
        mode: SIMPLE
        credentialName: k8sdev-wildcard-tls

---

apiVersion: v1
kind: Service
metadata:
  name: gw-databasus
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: internal-gateway
    istio: internal-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8451

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: databasus
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
    - databasus.k8sdev.rjst.de
  gateways:
    - databasus
  http:
    - route:
        - destination:
            host: databasus-service.databasus.svc.cluster.local
            port:
              number: 4005

---

apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: gw-databasus
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  networkRouterRef:
    name: proxy
    namespace: netbird
  serviceRef:
    name: gw-databasus
  groups:
    - name: k8s-databasus
    - name: kubernetes-services
