apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    istio-injection: enabled

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: spring
  namespace: prod

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: view-spring-prod
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: spring
    namespace: prod
