apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    istio-injection: enabled

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: spring
  namespace: dev

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view-spring-dev
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: spring
    namespace: dev
