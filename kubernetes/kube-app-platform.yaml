apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/ToXiCCuss/gitops.git
    targetRevision: master
    path: kubernetes
    directory:
      recurse: true
      exclude: "argocd-values.yaml,undeployed/**"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
