# NetBird groups exist only while this app is deployed (destination k8s-backstage, users backstage-users).
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-backstage
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-backstage

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: backstage-users
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: backstage-users

---

---

# backstage: https://backstage.k8sdev.rjst.de -> backstage.backstage:7007
# Own Gateway/Service/listener/NetBird resource per app - see kube-istio-internal.yaml.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: backstage
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: internal-gateway
  servers:
    - port:
        number: 8448
        name: https-backstage
        protocol: HTTPS
      hosts:
        - backstage.k8sdev.rjst.de
      tls:
        mode: SIMPLE
        credentialName: k8sdev-wildcard-tls

---

apiVersion: v1
kind: Service
metadata:
  name: gw-backstage
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: internal-gateway
    istio: internal-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8448

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backstage
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
    - backstage.k8sdev.rjst.de
  gateways:
    - backstage
  http:
    - route:
        - destination:
            host: backstage.backstage.svc.cluster.local
            port:
              number: 7007

---

apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: gw-backstage
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  networkRouterRef:
    name: proxy
    namespace: netbird
  serviceRef:
    name: gw-backstage
  groups:
    - name: k8s-backstage
    - name: kubernetes-services
