# Portal: https://portal.k8sdev.rjst.de - one page with the links to all apps and services.
#
# The page builds itself, nothing is listed by hand:
#   Kubernetes  every Istio VirtualService in the cluster (host -> https://<host>). Optional
#               annotations on the VirtualService: portal.rjst.de/name, /group, /description,
#               /icon (a devicon.dev name such as argocd, or name/variant such as jenkins/plain;
#               anything else is shown as text, e.g. an emoji), /hidden: "true", /stage, /version.
#               A VirtualService in one of the STAGE_NAMESPACES (dev, prod, ...) is an app with
#               a stage: one card per app, one link per stage, name from the app label,
#               version from app.kubernetes.io/version.
#   Docker      every service in docker/*/docker-compose.yml that has the labels portal.name
#               and portal.url (the NetBird reverse proxy address, https://<app>.proxy.rjst.de);
#               optional portal.group, portal.description, portal.icon (devicon.dev name). The repository is read
#               from Git, so a service shows up once it is merged, not once it runs.
#
# The sidecar renders /data/services.json every minute, nginx serves it next to index.html.
# Own Gateway/Service/listener/NetBird resource - see kube-istio-internal.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: portal
  annotations:
    argocd.argoproj.io/sync-wave: "1"

---

# NetBird groups exist only while this app is deployed (destination k8s-portal, users portal-users).
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-portal
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-portal

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: portal-users
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: portal-users

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal-virtualservices
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal-virtualservices
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portal-virtualservices
subjects:
  - kind: ServiceAccount
    name: portal
    namespace: portal

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-generator
  namespace: portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  generate.sh: |
    #!/bin/sh
    # Collects the links into /data/services.json. A failing source keeps its last result.
    set -u
    OUT=/data/services.json
    WORK=/tmp/portal
    mkdir -p "$WORK"

    while true; do
      # Kubernetes: one card per VirtualService, hosts without a dot and wildcards are mesh-internal
      if kubectl get virtualservices.networking.istio.io -A -o json > "$WORK/vs.raw" 2> "$WORK/err"; then
        jq --arg stages "$STAGE_NAMESPACES" '
          ($stages | split(",")) as $st
          | [.items[]
             | select((.metadata.annotations["portal.rjst.de/hidden"] // "") != "true")
             | (.spec.hosts // [])[0] as $h
             | select($h != null and ($h | contains(".")) and (($h | contains("*")) | not))
             | (.metadata.annotations // {}) as $a
             | (.metadata.labels // {}) as $l
             | (.metadata.namespace) as $ns
             | ($a["portal.rjst.de/stage"] // (if ($st | index($ns)) != null then $ns else "" end)) as $stage
             | { name: ($a["portal.rjst.de/name"] // $l["app"] // $l["app.kubernetes.io/instance"] // ($h | split(".")[0])),
                 url: ("https://" + $h),
                 group: ($a["portal.rjst.de/group"] // (if $stage != "" then "Anwendungen" else "Kubernetes" end)),
                 description: ($a["portal.rjst.de/description"] // ""),
                 icon: ($a["portal.rjst.de/icon"] // (if $l["app.kubernetes.io/name"] == "spring-boot" then "spring" else "" end)),
                 stage: $stage,
                 version: ($a["portal.rjst.de/version"] // $l["app.kubernetes.io/version"] // "") }]' \
          "$WORK/vs.raw" > "$WORK/k8s.json.new" && mv "$WORK/k8s.json.new" "$WORK/k8s.json"
      else
        echo "kubectl failed: $(cat "$WORK/err")" >&2
      fi

      # Docker: services of docker/*/docker-compose.yml with a portal.name label
      if [ -d "$WORK/repo/.git" ]; then
        git -C "$WORK/repo" fetch -q --depth 1 origin "$REPO_BRANCH" \
          && git -C "$WORK/repo" reset -q --hard FETCH_HEAD || echo "git fetch failed" >&2
      else
        rm -rf "$WORK/repo"
        git clone -q --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" "$WORK/repo" || echo "git clone failed" >&2
      fi
      if [ -d "$WORK/repo/docker" ]; then
        for f in "$WORK"/repo/docker/*/docker-compose.yml; do
          yq -o=json -I=0 '[.services[].labels // {}]' "$f" || echo "cannot read $f" >&2
        done | jq -s \
          'add // []
           | [.[]
              | select(type == "object" and has("portal.name") and has("portal.url"))
              | { name: .["portal.name"],
                  url: .["portal.url"],
                  group: (.["portal.group"] // "Docker"),
                  description: (.["portal.description"] // ""),
                  icon: (.["portal.icon"] // "") }]' \
          > "$WORK/docker.json.new" && mv "$WORK/docker.json.new" "$WORK/docker.json"
      fi

      FILES=""
      for f in k8s.json docker.json; do
        [ -f "$WORK/$f" ] && FILES="$FILES $WORK/$f"
      done
      if [ -n "$FILES" ]; then
        # shellcheck disable=SC2086
        jq -s '{ generated: (now | todate), services: (add | sort_by(.group, .name)) }' $FILES > "$OUT.new" \
          && mv "$OUT.new" "$OUT"
      fi
      sleep 60
    done

  nginx.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      add_header X-Content-Type-Options nosniff;
      location = /services.json {
        alias /data/services.json;
        default_type application/json;
        add_header Cache-Control "no-store";
      }
      location = /healthz {
        access_log off;
        return 200 "ok";
      }
    }

  index.html: |
    <!doctype html>
    <html lang="de">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal</title>
    <style>
      :root {
        --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #646d78;
        --line: #dfe3e8; --accent: #2f6fed;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111418; --card: #1a1f26; --text: #e7eaee; --muted: #8b95a1; --line: #2a313b; --accent: #6b9bff; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
      header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
      h1 { margin: 0; font-size: 22px; flex: 1; }
      input { width: min(100%, 320px); padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
              background: var(--card); color: var(--text); font: inherit; }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      h2 { margin: 28px 0 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
      .card { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card);
               border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
      a.card:hover, a.card:focus-visible { border-color: var(--accent); }
      .icon { flex: none; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
              background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
              font-weight: 600; font-size: 17px; }
      .icon.img { background: #fff; border: 1px solid var(--line); }
      .icon img { width: 22px; height: 22px; }
      .name { font-weight: 600; }
      .desc, .host { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
      div.card { cursor: default; }
      .stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      a.stage { padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px;
                color: var(--text); text-decoration: none; }
      a.stage:hover, a.stage:focus-visible { border-color: var(--accent); }
      a.stage.prod { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: var(--accent); font-weight: 600; }
      a.stage small { color: var(--muted); font-weight: 400; margin-left: 4px; }
      .info { color: var(--muted); margin-top: 32px; font-size: 12.5px; }
    </style>
    </head>
    <body>
    <main>
      <header>
        <h1>Portal</h1>
        <input id="q" type="search" placeholder="Suchen  ( / )" autocomplete="off">
      </header>
      <div id="content"></div>
      <p class="info" id="info"></p>
    </main>
    <script>
      let data = { services: [], generated: "" };
      const q = document.getElementById("q");
      const content = document.getElementById("content");

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }

      const STAGE_ORDER = ["dev", "test", "stage", "prod"];
      const stageRank = s => { const i = STAGE_ORDER.indexOf(s); return i < 0 ? STAGE_ORDER.length - 1 + 0.5 : i; };

      // icon: a devicon.dev name ("argocd" or "jenkins/plain") becomes a logo, other text is shown as is
      const DEVICON = "https://cdn.jsdelivr.net/gh/devicons/devicon@v2.17.0/icons/";
      function iconEl(s) {
        const fallback = s.name.charAt(0).toUpperCase();
        const m = /^([a-z0-9]+)(?:\/([a-z-]+))?$/.exec(s.icon || "");
        if (!m) return el("div", "icon", s.icon || fallback);
        const box = el("div", "icon img");
        const img = document.createElement("img");
        img.src = DEVICON + m[1] + "/" + m[1] + "-" + (m[2] || "original") + ".svg";
        img.alt = "";
        img.addEventListener("error", () => { box.className = "icon"; box.textContent = fallback; });
        box.append(img);
        return box;
      }

      function render() {
        const term = q.value.trim().toLowerCase();
        const groups = new Map();
        for (const s of data.services) {
          if (term && !(s.name + " " + s.description + " " + s.url + " " + s.group).toLowerCase().includes(term)) continue;
          if (!groups.has(s.group)) groups.set(s.group, []);
          groups.get(s.group).push(s);
        }
        content.replaceChildren();
        if (!groups.size) content.append(el("p", "desc", term ? "Nichts gefunden." : "Noch keine Einträge."));
        for (const [group, items] of groups) {
          content.append(el("h2", "", group));
          const grid = el("div", "grid");
          // entries with a stage are one card per app with one link per stage
          const cards = new Map();
          for (const s of items) {
            const key = s.stage ? "app:" + s.name : "url:" + s.url;
            if (!cards.has(key)) cards.set(key, []);
            cards.get(key).push(s);
          }
          for (const entries of cards.values()) {
            const s = entries[0];
            const staged = !!s.stage;
            const card = el(staged ? "div" : "a", "card");
            if (!staged) card.href = s.url;
            card.append(iconEl(s));
            const text = el("div");
            text.append(el("div", "name", s.name));
            if (!staged) text.append(el("div", "desc", s.description || new URL(s.url).host));
            else {
              if (s.description) text.append(el("div", "desc", s.description));
              const row = el("div", "stages");
              entries.sort((x, y) => stageRank(x.stage) - stageRank(y.stage) || x.stage.localeCompare(y.stage));
              for (const e of entries) {
                const chip = el("a", "stage" + (e.stage === "prod" ? " prod" : ""), e.stage);
                chip.href = e.url;
                if (e.version) chip.append(el("small", "", e.version));
                row.append(chip);
              }
              text.append(row);
            }
            card.append(text);
            grid.append(card);
          }
          content.append(grid);
        }
        document.getElementById("info").textContent =
          data.generated ? "Stand: " + new Date(data.generated).toLocaleString("de-DE") : "";
      }

      async function load() {
        try {
          const r = await fetch("services.json", { cache: "no-store" });
          if (r.ok) { data = await r.json(); render(); }
        } catch (e) { /* keep showing the last list */ }
      }

      q.addEventListener("input", render);
      document.addEventListener("keydown", e => {
        if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
      });
      load();
      setInterval(load, 60000);
    </script>
    </body>
    </html>

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      serviceAccountName: portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: data
              mountPath: /data
              readOnly: true
            # official image as non-root: writable cache dir and pid file (nginx.conf: pid /run/nginx.pid)
            - name: tmp
              mountPath: /var/cache/nginx
              subPath: cache
            - name: tmp
              mountPath: /run
              subPath: run
            - name: tmp
              mountPath: /tmp
        - name: generator
          image: alpine/k8s:1.35.9@sha256:b9cb6db0091a2327c0a56ecda69d37fa830c7a96ea669e7382b3ee778aa07a24
          command: ["/bin/sh", "/config/generate.sh"]
          env:
            - name: HOME
              value: /tmp/portal
            - name: REPO_URL
              value: https://github.com/ToXiCCuss/gitops.git
            - name: REPO_BRANCH
              value: master
            # VirtualServices in these namespaces are apps with a stage (namespace = stage).
            - name: STAGE_NAMESPACES
              value: dev,test,stage,prod
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: generator-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: portal-generator
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: generator-tmp
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: portal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 80
      targetPort: 8080

---

# portal: https://portal.k8sdev.rjst.de -> portal.portal:80
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: portal
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: internal-gateway
  servers:
    - port:
        number: 8451
        name: https-portal
        protocol: HTTPS
      hosts:
        - portal.k8sdev.rjst.de
      tls:
        mode: SIMPLE
        credentialName: k8sdev-wildcard-tls

---

apiVersion: v1
kind: Service
metadata:
  name: gw-portal
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: internal-gateway
    istio: internal-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8451

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: portal
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    portal.rjst.de/name: Portal
    portal.rjst.de/description: Alle Apps und Services
spec:
  hosts:
    - portal.k8sdev.rjst.de
  gateways:
    - portal
  http:
    - route:
        - destination:
            host: portal.portal.svc.cluster.local
            port:
              number: 80

---

apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: gw-portal
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  networkRouterRef:
    name: proxy
    namespace: netbird
  serviceRef:
    name: gw-portal
  groups:
    - name: k8s-portal
    - name: kubernetes-services
