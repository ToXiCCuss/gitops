apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: prometheus
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 11.19.1
    chart: prometheus-blackbox-exporter
    plugin:
      env:
        - name: HELM_VALUES
          value: |
            fullnameOverride: blackbox-exporter
            resources:
              limits:
                memory: 100Mi
                cpu: 250m
              requests:
                memory: 20Mi
                cpu: 10m
            serviceMonitor:
              selfMonitor:
                enabled: true
            config:
              modules:
                # The application answers on the real URL: the gateway, the certificate and the DNS record work.
                # Redirects are not followed and a login wall (401/403) counts as up, so a probe does not depend
                # on Keycloak or on the login page of another application.
                http_up:
                  prober: http
                  timeout: 10s
                  http:
                    valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
                    valid_status_codes: [200, 301, 302, 303, 307, 308, 401, 403]
                    follow_redirects: false
                    preferred_ip_protocol: "ip4"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
