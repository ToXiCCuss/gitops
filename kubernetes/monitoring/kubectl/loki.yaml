# Grafana picks this up through the datasource sidecar (label grafana_datasource). It holds the tracing datasources
# together, because the derived field and the trace-to-logs link need the escape $${...}: Grafana expands $VAR in
# provisioning files, $$ stays a literal $. A Helm value of an ArgoCD plugin app could not carry it, ArgoCD replaces $NAME there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-tracing
  namespace: prometheus
  labels:
    grafana_datasource: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  tracing.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.loki:3100
        jsonData:
          # The trace id in a log line becomes a link to the trace in Tempo: the Spring Boot correlation
          # [app,traceId,spanId] of the text logs, and trace.id of the ECS JSON logs (logging.springJson).
          derivedFields:
            - name: traceId
              matcherRegex: '\[[^,\]]*,(\w{32}),'
              url: '$${__value.raw}'
              datasourceUid: tempo
              urlDisplayLabel: Trace
            - name: traceId (json)
              matcherRegex: '"trace\.id":"(\w{32})"'
              url: '$${__value.raw}'
              datasourceUid: tempo
              urlDisplayLabel: Trace
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo:3200
        jsonData:
          nodeGraph:
            enabled: true
          # Service graph and the "Tempo" links of the RED table come from the metrics Tempo writes to Prometheus
          serviceMap:
            datasourceUid: prometheus
          tracesToMetrics:
            datasourceUid: prometheus
          # From a trace to the log lines that carry its id (the span names of Istio and of the apps differ, so no tag mapping)
          tracesToLogsV2:
            datasourceUid: loki
            customQuery: true
            query: '{namespace=~".+"} |= "$${__trace.traceId}"'
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
