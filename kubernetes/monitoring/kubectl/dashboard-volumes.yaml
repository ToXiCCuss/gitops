# Grafana picks this up through the dashboard sidecar (label grafana_dashboard, all namespaces).
# Volume view: disk usage per local-path volume (PVC) of the k3s node. The kubelet reports the usage of the whole disk
# for these volumes, so the numbers come from node_pvc_used_bytes, which the node_exporter role writes from the volume
# directories (ansible/roles/node_exporter/files/node-pvc-usage.sh), and from the filesystem metrics of the node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-volumes
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    grafana_folder: "Infrastructure"
data:
  volumes.json: |
    {
      "uid": "volumes",
      "title": "Volumes",
      "tags": [
        "storage",
        "k3s"
      ],
      "timezone": "Europe/Berlin",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Volumes together",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(node_pvc_used_bytes)",
              "legendFormat": "",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "description": "Sum of all local-path volumes of the k3s node.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Disk used",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(1 - node_filesystem_avail_bytes{instance=~\"k8sdev01.*\",mountpoint=\"/\"} / node_filesystem_size_bytes{instance=~\"k8sdev01.*\",mountpoint=\"/\"}) * 100",
              "legendFormat": "",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "description": "Root disk of the k3s node (all volumes, images, logs and the system).",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Disk free",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_filesystem_avail_bytes{instance=~\"k8sdev01.*\",mountpoint=\"/\"}",
              "legendFormat": "",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Volumes share of the disk",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(node_pvc_used_bytes) / scalar(node_filesystem_size_bytes{instance=~\"k8sdev01.*\",mountpoint=\"/\"}) * 100",
              "legendFormat": "",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "description": "What the volumes take of the whole root disk. The rest is the system, images, logs and the Docker data.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "Used per volume",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sort_desc(node_pvc_used_bytes)",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "description": "Disk usage of the directory of every volume. A volume that is no longer in the cluster is not listed once its directory is deleted.",
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Growth per volume",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_pvc_used_bytes",
              "legendFormat": "",
              "refId": "A",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_pvc_used_bytes - node_pvc_used_bytes offset 1d",
              "legendFormat": "",
              "refId": "B",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_pvc_used_bytes - node_pvc_used_bytes offset 7d",
              "legendFormat": "",
              "refId": "C",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Used"
                  },
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Change 1d"
                  },
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #C"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Change 7d"
                  },
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              }
            ]
          },
          "description": "Used now and the change against 1 day and 7 days ago. A volume that is younger than that shows no change.",
          "options": {
            "sortBy": [
              {
                "displayName": "Used",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "instance": true,
                  "job": true
                },
                "indexByName": {
                  "namespace": 0,
                  "persistentvolumeclaim": 1
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "persistentvolumeclaim": "Volume"
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Used per volume over time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_pvc_used_bytes",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A",
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Disk used over time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_filesystem_size_bytes{instance=~\"k8sdev01.*\",mountpoint=\"/\"} - node_filesystem_avail_bytes{instance=~\"k8sdev01.*\",mountpoint=\"/\"}",
              "legendFormat": "used",
              "refId": "A",
              "format": "time_series"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(node_pvc_used_bytes)",
              "legendFormat": "all volumes",
              "refId": "B",
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              },
              "min": 0
            },
            "overrides": []
          },
          "description": "Used space of the root disk against the part that the volumes take.",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
