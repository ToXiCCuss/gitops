# One probe per web UI, checked by the blackbox-exporter (kubernetes/monitoring/helm/blackbox-exporter.yaml).
# Add a URL to the list of its group; probe_success and the certificate expiry then show up in Prometheus
# and the alerts in alert-rules.yaml apply to it.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: web-ui
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  module: http_up
  interval: 1m
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.prometheus:9115
  targets:
    staticConfig:
      labels:
        group: infrastructure
      static:
        - https://argocd.k8sdev.rjst.de
        - https://grafana.k8sdev.rjst.de
        - https://harbor.k8sdev.rjst.de
        - https://jenkins.k8sdev.rjst.de
        - https://portal.k8sdev.rjst.de
        - https://prometheus.k8sdev.rjst.de
        - https://vault.k8sdev.rjst.de
        - https://auth.proxy.rjst.de

---

apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: spring-apps
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  module: http_up
  interval: 1m
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.prometheus:9115
  targets:
    staticConfig:
      labels:
        group: applications
      static:
        - https://freewar-chaos-service-dev.k8sdev.rjst.de
        - https://freewar-chaos-service-prod.k8sdev.rjst.de
        - https://freewar-digmap-dev.k8sdev.rjst.de
        - https://freewar-digmap-prod.k8sdev.rjst.de
