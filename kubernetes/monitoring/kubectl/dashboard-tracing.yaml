# Grafana picks this up through the dashboard sidecar (label grafana_dashboard, all namespaces).
# Calls, errors and latency per service from the span metrics Tempo writes to Prometheus (see helm/tempo.yaml),
# plus the service graph.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tracing
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    grafana_folder: "Observability"
data:
  tracing.json: |
    {
      "uid": "tracing",
      "title": "Tracing",
      "tags": [
        "tracing",
        "tempo"
      ],
      "timezone": "Europe/Berlin",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "templating": {
        "list": [
          {
            "type": "custom",
            "name": "stage",
            "label": "Stage",
            "description": "Namespace of the Spring apps: their services are named <app>.<namespace> (Istio and spring-boot-chart).",
            "query": "dev and prod : dev|prod, dev : dev, prod : prod",
            "current": {
              "text": "dev and prod",
              "value": "dev|prod"
            },
            "options": [
              {
                "selected": true,
                "text": "dev and prod",
                "value": "dev|prod"
              },
              {
                "selected": false,
                "text": "dev",
                "value": "dev"
              },
              {
                "selected": false,
                "text": "prod",
                "value": "prod"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "bargauge",
          "title": "Calls per service (selected time range)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (increase(traces_spanmetrics_calls_total{span_kind=\"SPAN_KIND_SERVER\", service=~\".+[.]($stage)\"}[$__range]))",
              "legendFormat": "{{service}}",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{span_kind=\"SPAN_KIND_SERVER\", service=~\".+[.]($stage)\"}[$__rate_interval]))",
              "legendFormat": "{{service}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Errors per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\", service=~\".+[.]($stage)\"}[$__rate_interval]))",
              "legendFormat": "{{service}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Latency p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{span_kind=\"SPAN_KIND_SERVER\", service=~\".+[.]($stage)\"}[$__rate_interval])))",
              "legendFormat": "{{service}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Who calls whom (selected time range)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client, server) (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range]))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          }
        },
        {
          "id": 6,
          "type": "nodeGraph",
          "title": "Service graph",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 12,
            "h": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "serviceMap",
              "serviceMapQuery": [
                "{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}",
                "{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}"
              ],
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 7,
          "type": "nodeGraph",
          "title": "Service graph (icons)",
          "description": "Same edges as the service graph, built from the Prometheus metrics of Tempo so every node gets a type icon: cube = Spring app, database = database, lock = internal gateway (NetBird), globe = public gateway. Edges from the internal gateway are blue, from the public gateway orange. Calls without trace context (probes, monitoring) are left out. Numbers are requests in the selected range. Ring: green up to 1 % failed requests, orange up to 5 %, red above.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 17,
            "w": 12,
            "h": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "round(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(sum by (id) (label_replace(sum by (server) (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])), \"id\", \"$1\", \"server\", \"(.*)\") or label_replace(sum by (client) (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])), \"id\", \"$1\", \"client\", \"(.*)\") * 0), \"icon\", \"database\", \"id\", \"[^.]+\"), \"icon\", \"user\", \"id\", \"user\"), \"icon\", \"cube\", \"id\", \".+[.](dev|prod)\"), \"icon\", \"lock\", \"id\", \"internal-gateway[.].*\"), \"icon\", \"globe\", \"id\", \"istio-ingressgateway[.].*\"), \"title\", \"$1\", \"id\", \"(.*)\"))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "round((label_replace((sum by (id) (label_replace(sum by (server) ((increase(traces_service_graph_request_failed_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_failed_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])) or (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])) * 0), \"id\", \"$1\", \"server\", \"(.*)\")) / sum by (id) (label_replace(sum by (server) (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])), \"id\", \"$1\", \"server\", \"(.*)\"))) <= 0.01, \"color\", \"#73BF69\", \"id\", \".*\") or label_replace((sum by (id) (label_replace(sum by (server) ((increase(traces_service_graph_request_failed_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_failed_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])) or (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])) * 0), \"id\", \"$1\", \"server\", \"(.*)\")) / sum by (id) (label_replace(sum by (server) (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])), \"id\", \"$1\", \"server\", \"(.*)\"))) > 0.01 <= 0.05, \"color\", \"#FF9830\", \"id\", \".*\") or label_replace((sum by (id) (label_replace(sum by (server) ((increase(traces_service_graph_request_failed_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_failed_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])) or (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])) * 0), \"id\", \"$1\", \"server\", \"(.*)\")) / sum by (id) (label_replace(sum by (server) (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])), \"id\", \"$1\", \"server\", \"(.*)\"))) > 0.05, \"color\", \"#F2495C\", \"id\", \".*\")) * 100, 0.01)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "label_replace(label_replace(round(label_replace(label_replace(label_join(sum by (client, server) (increase(traces_service_graph_request_total{client=~\".+[.]($stage)\", server!~\"(tempo|vault)[.].*\"}[$__range]) or increase(traces_service_graph_request_total{server=~\".+[.]($stage)\", client!~\"user|[0-9.:]+\"}[$__range])), \"id\", \" -> \", \"client\", \"server\"), \"source\", \"$1\", \"client\", \"(.*)\"), \"target\", \"$1\", \"server\", \"(.*)\")), \"color\", \"#5794F2\", \"client\", \"internal-gateway[.].*\"), \"color\", \"#FF9830\", \"client\", \"istio-ingressgateway[.].*\")",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table",
              "refId": "D"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "filter": {
                "id": "byRefId",
                "options": "/^[AB]$/"
              },
              "options": {
                "byField": "id",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "client": true,
                  "server": true
                },
                "renameByName": {
                  "Value #A": "mainstat",
                  "Value #B": "detail__Failed %",
                  "Value #D": "mainstat"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        }
      ]
    }
