# Grafana picks this up through the dashboard sidecar (label grafana_dashboard, all namespaces).
# Log volume, errors and the log lines of all pods. The labels namespace, pod, container and app come from the Alloy pipeline
# (kubernetes/monitoring/helm/alloy.yaml). The container is the filter that tells the Spring apps apart, their app label is the chart name.
# ERROR and WARN are found as words in the line, which fits the Spring Boot log pattern and the ECS JSON format.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-logs
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  logs.json: |
    {
      "uid": "logs",
      "title": "Logs",
      "tags": [
        "loki",
        "logs"
      ],
      "timezone": "Europe/Berlin",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "type": 1,
              "label": "namespace",
              "stream": "",
              "refId": "LokiVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "container",
            "label": "Container",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "type": 1,
              "label": "container",
              "stream": "{namespace=~\"$namespace\"}",
              "refId": "LokiVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values({namespace=~\"$namespace\"}, container)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "search",
            "label": "Search",
            "type": "textbox",
            "query": "",
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Log lines",
          "description": "In the selected time range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |= \"$search\" [$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Errors",
          "description": "Lines with ERROR or FATAL as a word.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |~ `\\b(ERROR|FATAL)\\b` [$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Warnings",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |~ `\\bWARN\\b` [$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Containers logging",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "count(sum by (namespace, container) (count_over_time({namespace=~\"$namespace\", container=~\"$container\"} [$__range])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "row",
          "title": "Volume",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Log lines by container",
          "description": "Lines per interval, the interval follows the zoom.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (container) (count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |= \"$search\" [$__auto]))",
              "legendFormat": "{{container}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "drawStyle": "bars"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Errors and warnings",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum (count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |~ `\\b(ERROR|FATAL)\\b` [$__auto]))",
              "legendFormat": "errors",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum (count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |~ `\\bWARN\\b` [$__auto]))",
              "legendFormat": "warnings",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "drawStyle": "bars"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "warnings"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Containers with the most errors",
          "description": "Top 10 in the selected time range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "topk(10, sum by (namespace, container) (count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |~ `\\b(ERROR|FATAL)\\b` [$__range])))",
              "legendFormat": "{{namespace}} / {{container}}",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "continuous-GrYlRd"
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Containers with the most lines",
          "description": "Top 10 in the selected time range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "topk(10, sum by (namespace, container) (count_over_time({namespace=~\"$namespace\", container=~\"$container\"} [$__range])))",
              "legendFormat": "{{namespace}} / {{container}}",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "continuous-GrYlRd"
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Lines",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "logs",
          "title": "Errors and warnings",
          "description": "Lines with WARN, ERROR or FATAL. A trace id opens the trace in Tempo.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=~\"$namespace\", container=~\"$container\"} |~ `\\b(WARN|ERROR|FATAL)\\b` |= \"$search\"",
              "queryType": "range",
              "maxLines": 1000,
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 13,
          "type": "logs",
          "title": "All lines",
          "description": "Case sensitive text search in the line, set it in the Search field above.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=~\"$namespace\", container=~\"$container\"} |= \"$search\"",
              "queryType": "range",
              "maxLines": 1000,
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }
      ]
    }
