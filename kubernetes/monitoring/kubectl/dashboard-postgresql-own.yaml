# Grafana picks this up through the dashboard sidecar (label grafana_dashboard, all namespaces).
# PostgreSQL view for the postgres_exporter on docker01 (job postgres-exporter): sessions and locks, throughput,
# storage and wraparound, checkpoints, pg_stat_statements and the exporter itself. Own build, it sits next to the
# imported "PostgreSQL Database" dashboard (dashboard-postgresql.yaml). Panels read only metrics of the collectors in
# ansible/roles/postgres_exporter/defaults/main.yml. Alert: PostgresDown (alert-rules.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgresql-own
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    grafana_folder: "Databases"
data:
  postgresql-own.json: |
    {
      "uid": "postgresql",
      "title": "PostgreSQL",
      "tags": [
        "postgresql",
        "database"
      ],
      "timezone": "Europe/Berlin",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(pg_up, instance)",
              "refId": "instance"
            },
            "definition": "label_values(pg_up, instance)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false
          },
          {
            "name": "datname",
            "label": "Database",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(pg_stat_database_numbackends{instance=\"$instance\"}, datname)",
              "refId": "datname"
            },
            "definition": "label_values(pg_stat_database_numbackends{instance=\"$instance\"}, datname)",
            "regex": "/^(?!template).+/",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "pg_up{instance=\"$instance\"}",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Down",
                      "color": "red",
                      "index": 1
                    },
                    "1": {
                      "text": "Up",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Uptime",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 3,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - pg_postmaster_start_time_seconds{instance=\"$instance\"}",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 300
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "description": "Red for five minutes after a restart of PostgreSQL."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Version",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "pg_static{instance=\"$instance\"}",
              "legendFormat": "{{short_version}}",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Connections used",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 9,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(pg_stat_activity_count{instance=\"$instance\"}) / max(pg_settings_max_connections{instance=\"$instance\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "description": "Sessions of all databases against max_connections."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Cache hit ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(pg_stat_database_blks_hit{instance=\"$instance\", datname=~\"$datname\"}[$__range])) / (sum(increase(pg_stat_database_blks_hit{instance=\"$instance\", datname=~\"$datname\"}[$__range])) + sum(increase(pg_stat_database_blks_read{instance=\"$instance\", datname=~\"$datname\"}[$__range])))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "description": "Share of block reads served from shared buffers over the selected time range."
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Longest transaction",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 15,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(pg_stat_activity_max_tx_duration{instance=\"$instance\", datname=~\"$datname\"}) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 300
                  },
                  {
                    "color": "red",
                    "value": 3600
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "description": "A transaction that stays open holds back VACUUM and keeps its locks."
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Deadlocks",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(pg_stat_database_deadlocks{instance=\"$instance\", datname=~\"$datname\"}[$__range])) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "description": "Deadlocks over the selected time range."
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Database size",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 21,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(pg_database_size_bytes{instance=\"$instance\", datname=~\"$datname\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Sessions and locks",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Sessions by state",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (state) (pg_stat_activity_count{instance=\"$instance\", datname=~\"$datname\"})",
              "legendFormat": "{{state}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "active"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "idle"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "idle in transaction"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "idle in transaction (aborted)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Idle in transaction means a session opened a transaction and does nothing in it."
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Connections against the limit",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(pg_stat_activity_count{instance=\"$instance\"})",
              "legendFormat": "Sessions",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(pg_settings_max_connections{instance=\"$instance\"})",
              "legendFormat": "max_connections",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "max_connections"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Locks by mode",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (mode) (pg_locks_count{instance=\"$instance\", datname=~\"$datname\"})",
              "legendFormat": "{{mode}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Longest open transaction per database",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (datname) (pg_stat_activity_max_tx_duration{instance=\"$instance\", datname=~\"$datname\"})",
              "legendFormat": "{{datname}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 15,
          "type": "row",
          "title": "Throughput",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Transactions per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(pg_stat_database_xact_commit{instance=\"$instance\", datname=~\"$datname\"}[$__rate_interval]))",
