# Grafana picks this up through the dashboard sidecar (label grafana_dashboard, all namespaces).
# Traffic through the two Istio ingress gateways: the public istio-ingressgateway (istio-system, from the Internet) and the
# internal-gateway (istio-internal, NetBird only). The metrics are istio_requests_total and the byte counters reported by the
# gateway Envoys (reporter="source", job envoy-stats), so the dashboard shows what entered the cluster, per gateway and per
# destination service. Destination "unknown" on the public gateway is traffic no route matched (scans, wrong hosts).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-istio-ingress
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  istio-ingress.json: |
    {
      "uid": "istio-ingress-traffic",
      "title": "Istio Ingress Traffic",
      "tags": [
        "istio",
        "gateway",
        "traffic"
      ],
      "timezone": "Europe/Berlin",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 2,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 3,
          "type": "stat",
          "title": "External requests/s",
          "description": "Public gateway istio-ingressgateway (istio-system).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(istio_requests_total{reporter=\"source\", source_workload=\"istio-ingressgateway\"}[$__rate_interval]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "reduceOptions": {
