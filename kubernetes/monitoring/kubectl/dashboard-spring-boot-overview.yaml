          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=~\"$namespace\", application=~\"$application\", pod=~\"$pod\", area=\"heap\"})",
              "legendFormat": "{{pod}} used",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
