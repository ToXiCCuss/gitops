# NetBird groups exist only while this app is deployed (destination k8s-grafana, users grafana-users).
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-grafana
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-grafana

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: grafana-users
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: grafana-users

---

---

# grafana: https://grafana.k8sdev.rjst.de -> grafana.prometheus:80
# Own Gateway/Service/listener/NetBird resource per app - see kube-istio-internal.yaml.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: grafana
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: internal-gateway
  servers:
    - port:
        number: 8445
        name: https-grafana
        protocol: HTTPS
      hosts:
        - grafana.k8sdev.rjst.de
      tls:
        mode: SIMPLE
        credentialName: k8sdev-wildcard-tls

---

apiVersion: v1
kind: Service
metadata:
  name: gw-grafana
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: internal-gateway
    istio: internal-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8445

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
    - grafana.k8sdev.rjst.de
  gateways:
    - grafana
  http:
    - route:
        - destination:
            host: grafana.prometheus.svc.cluster.local
            port:
              number: 80

---

apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: gw-grafana
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  networkRouterRef:
    name: proxy
    namespace: netbird
  serviceRef:
    name: gw-grafana
  groups:
    - name: k8s-grafana
    - name: kubernetes-services
