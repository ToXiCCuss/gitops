# Grafana picks this up through the dashboard sidecar (label grafana_dashboard, all namespaces).
# Where the requests of the public Istio ingress gateway come from: country, provider (ASN), client address, host, path.
# The source is the JSON access log of the gateway (extension provider access-json in istio/istio-operator.yaml, switched on by
# kubernetes/infra/kubectl/kube-istio-telemetry.yaml). Alloy adds the label geoip_country_code and the ASN organization
# (kubernetes/monitoring/helm/alloy.yaml). The client address and the rest are read from the line with `| json`, never labels.
# Generated once from a script, edit it like any other dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-traffic
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    grafana_folder: "Observability"
data:
  traffic.json: |
    {
      "uid": "traffic",
      "title": "Public traffic",
      "tags": [
        "loki",
        "istio",
        "traffic"
      ],
      "timezone": "Europe/Berlin",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "search",
            "label": "Search",
            "type": "textbox",
            "query": "",
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests",
          "description": "In the selected time range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=\"istio-system\", container=\"istio-proxy\"} |= \"\\\"client_ip\\\"\" |= `$search` [$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
