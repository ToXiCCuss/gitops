apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: availability
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: availability
      rules:
        - alert: TargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} on {{ $labels.instance }} is not scraped"

---

# The postgres_exporter keeps answering when PostgreSQL itself is down, so TargetDown does not catch it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: postgresql
      rules:
        - alert: PostgresDown
          expr: pg_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL on {{ $labels.instance }} is not reachable by the exporter"

---

# Same for the mysqld_exporter: it keeps answering when MariaDB is down.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mariadb
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: mariadb
      rules:
        - alert: MariaDBDown
          expr: mysql_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MariaDB on {{ $labels.instance }} is not reachable by the exporter"

---

# The node_exporter runs on the hosts and in the cluster. RAM-backed and boot filesystems are left out, they
# fill up or sit at 100 % without being a problem. The same selector feeds the disk panel of the Status dashboard.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: disk
      rules:
        - alert: DiskAlmostFull
          expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|vfat|fuse.*|overlay|squashfs|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|vfat|fuse.*|overlay|squashfs|nsfs"}) * 100 > 90
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }} % full"

---

# The probes of probes.yaml. The wildcard certificate is shared, so only the soonest expiry is reported.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: probes
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: probes
      rules:
        - alert: ProbeFailed
          expr: probe_success == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} does not answer"
        - alert: CertificateExpiresSoon
          expr: bottomk(1, probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "The certificate of {{ $labels.instance }} expires in less than 14 days"

---

# The backup jobs write backup_last_success_timestamp_seconds into the textfile collector of the
# node_exporter on docker01 after a successful run (see the *.sh scripts of the jobs). The nightly jobs
# are late after 26 hours. A failed run is posted by the job itself, this catches a job that does not run.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backups
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: backups
      rules:
        - alert: BackupTooOld
          expr: time() - backup_last_success_timestamp_seconds > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup {{ $labels.backup }} has no successful run for more than 26 hours"
        - alert: BackupNeverReported
          expr: absent(backup_last_success_timestamp_seconds{backup="offsite-sync"}) or absent(backup_last_success_timestamp_seconds{backup="vault-backup"}) or absent(backup_last_success_timestamp_seconds{backup="restic-backup"})
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "offsite-sync, vault-backup or restic-backup never reported a successful run"
        # restic-backup runs backup, forget, prune and check in one run and writes the result of every step
        # (restic_step_success), so a failed step shows up here the same night, not only after 26 hours
        - alert: ResticStepFailed
          expr: restic_step_success == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Step {{ $labels.step }} of the restic repository {{ $labels.repository }} failed"
