apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: availability
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: availability
      rules:
        - alert: TargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} on {{ $labels.instance }} is not scraped"

---

# The postgres_exporter keeps answering when PostgreSQL itself is down, so TargetDown does not catch it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: postgresql
      rules:
        - alert: PostgresDown
          expr: pg_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL on {{ $labels.instance }} is not reachable by the exporter"

---

# Same for the mysqld_exporter: it keeps answering when MariaDB is down.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mariadb
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: mariadb
      rules:
        - alert: MariaDBDown
          expr: mysql_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MariaDB on {{ $labels.instance }} is not reachable by the exporter"

---

# The node_exporter runs on the hosts and in the cluster. RAM-backed and boot filesystems are left out, they
# fill up or sit at 100 % without being a problem. The same selector feeds the disk panel of the Status dashboard.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: disk
      rules:
        - alert: DiskAlmostFull
          expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|vfat|fuse.*|overlay|squashfs|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|vfat|fuse.*|overlay|squashfs|nsfs"}) * 100 > 90
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }} % full"

---

# The backup jobs write backup_last_success_timestamp_seconds into the textfile collector of the
# node_exporter on docker01 after a successful run (see the *.sh scripts of the jobs). The nightly jobs
# are late after 26 hours. A failed run is posted by the job itself, this catches a job that does not run.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backups
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: backups
      rules:
        - alert: BackupTooOld
          expr: time() - backup_last_success_timestamp_seconds > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup {{ $labels.backup }} has no successful run for more than 26 hours"
        - alert: BackupNeverReported
          expr: absent(backup_last_success_timestamp_seconds{backup="offsite-sync"}) or absent(backup_last_success_timestamp_seconds{backup="restic-backup"})
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "offsite-sync or restic-backup never reported a successful run"
        # restic-backup runs backup, forget, prune and check in one run and writes the result of every step
        # (restic_step_success), so a failed step shows up here the same night, not only after 26 hours
        - alert: ResticStepFailed
          expr: restic_step_success == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Step {{ $labels.step }} of the restic repository {{ $labels.repository }} failed"
        # The Forgejo and Vault backups are CronJobs in the cluster (forgejo-backup.yaml, kube-vault-backup.yaml);
        # their result comes from kube-state-metrics.
        # A failed job stays in the history, so only jobs of the last day count.
        - alert: CronJobBackupFailed
          expr: |
            kube_job_status_failed{job_name=~"(forgejo|vault)-backup-.*"} > 0
              and on (namespace, job_name) time() - kube_job_created < 24 * 3600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The backup job {{ $labels.job_name }} failed (kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }})"
        - alert: CronJobBackupTooOld
          expr: time() - kube_cronjob_status_last_successful_time{cronjob=~"forgejo-backup|vault-backup"} > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "The backup {{ $labels.cronjob }} has no successful run for more than 26 hours"
        - alert: CronJobBackupNeverReported
          expr: absent(kube_cronjob_status_last_successful_time{cronjob="forgejo-backup"}) or absent(kube_cronjob_status_last_successful_time{cronjob="vault-backup"})
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "forgejo-backup or vault-backup never had a successful run"

---

# deploy.sh --metrics-file (started by the gitops-deploy timer on docker01, Ansible role gitops_deploy) leaves
# the result of every run in the textfile collector of the node_exporter. A project is deployed within 15 minutes
# of a merge to master (within 3 hours), so a project that stays failed or a timer that does not run means the host differs from Git.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-deploy
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: gitops-deploy
      rules:
        - alert: DockerDeployFailed
          expr: gitops_deploy_project_success == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "The Docker project {{ $labels.project }} cannot be deployed (journalctl -u gitops-deploy on {{ $labels.instance }})"
        # also fires when the timer is stopped or the AppRole files of Vault are missing (the unit is then skipped).
        # The timer runs every 3 hours from 08:00 to 20:00 local time (gitops_deploy_calendar), so the rule only looks
        # at 08:00-18:00 UTC (09/10:00-19/20:00 local, winter/summer time) and allows one missed run.
        # A failed git pull is not reported (deploy.sh deploys the checkout as it is).
        - alert: DockerDeployStale
          expr: time() - gitops_deploy_last_success_timestamp_seconds > 21600 and on() (hour() >= 8 and hour() < 18)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The last successful Docker deploy on {{ $labels.instance }} is more than six hours ago"
        # for: 2h so that the alert does not fire between the merge of the rule and the Ansible run on the host
        - alert: DockerDeployNeverReported
          expr: absent(gitops_deploy_last_success_timestamp_seconds)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "The gitops-deploy timer on docker01 never reported a successful run"
---
# apply_declared.sh --metrics-file (started by the postgresql-apply timer on docker01, Ansible role postgresql_apply)
# leaves the result of every run in the textfile collector of the node_exporter. databases/postgresql.yaml reaches
# the server within 3 hours of a merge to master, so a run that stays failed or a timer that does not run means the
# access on docker01 differs from Git.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql-apply
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: postgresql-apply
      rules:
        # also covers a failed git pull and a declared file that cannot be applied (journalctl -u postgresql-apply)
        - alert: DatabasesApplyFailed
          expr: gitops_databases_apply_success == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "databases/postgresql.yaml cannot be applied on {{ $labels.instance }} (journalctl -u postgresql-apply)"
        # also fires when the timer is stopped or the AppRole files of Vault are missing (the unit is then skipped).
        # The timer runs every 3 hours from 08:30 to 20:30 local time (postgresql_apply_calendar), so the rule only looks
        # at 08:00-18:00 UTC and allows one missed run.
        - alert: DatabasesApplyStale
          expr: time() - gitops_databases_last_success_timestamp_seconds > 21600 and on() (hour() >= 8 and hour() < 18)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The last successful apply of the declared PostgreSQL access on {{ $labels.instance }} is more than six hours ago"
        # for: 2h so that the alert does not fire between the merge of the rule and the Ansible run on the host
        - alert: DatabasesApplyNeverReported
          expr: absent(gitops_databases_last_success_timestamp_seconds)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "The postgresql-apply timer on docker01 never reported a successful run"
---
# State of the Argo CD Applications (metrics from the PodMonitor in argocd-metrics.yaml, dashboard "Argo CD").
# Every Application syncs automatically with selfHeal, so one that stays out of sync means its sync fails or it
# cannot be rendered, and the cluster differs from Git. argocd_app_info has one series per Application, value 1.
# A controller that is not scraped any more is TargetDown. Not covered: a Secret that AVP drops because a Vault key
# is missing, the Application then stays Synced.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: argocd
      rules:
        # for: 30m leaves room for a large sync and for the retries of a sync that fails once
        - alert: ArgoAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD Application {{ $labels.name }} is {{ $labels.sync_status }} for 30 minutes (health {{ $labels.health_status }})"
        # Suspended is left out on purpose (e.g. a suspended CronJob), Progressing has its own rule below
        - alert: ArgoAppUnhealthy
          expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"}
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD Application {{ $labels.name }} is {{ $labels.health_status }} (namespace {{ $labels.dest_namespace }})"
        # a rollout that never finishes, e.g. a pod that does not get ready
        - alert: ArgoAppProgressingTooLong
          expr: argocd_app_info{health_status="Progressing"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Argo CD Application {{ $labels.name }} is Progressing for an hour (namespace {{ $labels.dest_namespace }})"
