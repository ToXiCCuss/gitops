apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: availability
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: availability
      rules:
        - alert: TargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} on {{ $labels.instance }} is not scraped"

---

# The postgres_exporter keeps answering when PostgreSQL itself is down, so TargetDown does not catch it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: postgresql
      rules:
        - alert: PostgresDown
          expr: pg_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL on {{ $labels.instance }} is not reachable by the exporter"

---

# Same for the mysqld_exporter: it keeps answering when MariaDB is down.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mariadb
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: mariadb
      rules:
        - alert: MariaDBDown
          expr: mysql_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MariaDB on {{ $labels.instance }} is not reachable by the exporter"

---

# The node_exporter runs on the hosts and in the cluster. RAM-backed and boot filesystems are left out, they
# fill up or sit at 100 % without being a problem. The same selector feeds the disk panel of the Status dashboard.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: disk
      rules:
        - alert: DiskAlmostFull
          expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|vfat|fuse.*|overlay|squashfs|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|vfat|fuse.*|overlay|squashfs|nsfs"}) * 100 > 90
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }} % full"

---

# The probes of probes.yaml. The wildcard certificate is shared, so only the soonest expiry is reported.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: probes
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: probes
      rules:
        - alert: ProbeFailed
          expr: probe_success == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} does not answer"
        - alert: CertificateExpiresSoon
          expr: bottomk(1, probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "The certificate of {{ $labels.instance }} expires in less than 14 days"

---

# The backup jobs write backup_last_success_timestamp_seconds into the textfile collector of the
# node_exporter on docker01 after a successful run (see the *.sh scripts of the jobs). The nightly jobs
# are late after 26 hours. A failed run is posted by the job itself, this catches a job that does not run.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backups
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: backups
      rules:
        - alert: BackupTooOld
          expr: time() - backup_last_success_timestamp_seconds > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup {{ $labels.backup }} has no successful run for more than 26 hours"
        - alert: BackupNeverReported
          expr: absent(backup_last_success_timestamp_seconds{backup="offsite-sync"}) or absent(backup_last_success_timestamp_seconds{backup="vault-backup"}) or absent(backup_last_success_timestamp_seconds{backup="restic-backup"})
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "offsite-sync, vault-backup or restic-backup never reported a successful run"
        # restic-backup runs backup, forget, prune and check in one run and writes the result of every step
        # (restic_step_success), so a failed step shows up here the same night, not only after 26 hours
        - alert: ResticStepFailed
          expr: restic_step_success == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Step {{ $labels.step }} of the restic repository {{ $labels.repository }} failed"

---

# deploy.sh --metrics-file (started by the gitops-deploy timer on docker01, Ansible role gitops_deploy) leaves
# the result of every run in the textfile collector of the node_exporter. A project is deployed within 15 minutes
# of a merge to master, so a project that stays failed or a timer that does not run means the host differs from Git.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-deploy
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: gitops-deploy
      rules:
        - alert: DockerDeployFailed
          expr: gitops_deploy_project_success == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "The Docker project {{ $labels.project }} cannot be deployed (journalctl -u gitops-deploy on {{ $labels.instance }})"
        # deploys nothing when the pull fails (local changes in the checkout, a branch that cannot be fast-forwarded)
        - alert: DockerDeployPullFailed
          expr: gitops_deploy_pull_success == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "git pull --ff-only fails on {{ $labels.instance }}, no Docker project is deployed (journalctl -u gitops-deploy)"
        # also fires when the timer is stopped or the AppRole files of Vault are missing (the unit is then skipped).
        # The timer runs hourly from 08:00 to 20:00 local time (gitops_deploy_calendar), so the rule only looks
        # at 08:00-18:00 UTC (09/10:00-19/20:00 local, winter/summer time) and allows two missed runs.
        - alert: DockerDeployStale
          expr: time() - gitops_deploy_last_success_timestamp_seconds > 7200 and on() (hour() >= 8 and hour() < 18)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The last successful Docker deploy on {{ $labels.instance }} is more than two hours ago"
        # for: 2h so that the alert does not fire between the merge of the rule and the Ansible run on the host
        - alert: DockerDeployNeverReported
          expr: absent(gitops_deploy_last_success_timestamp_seconds)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "The gitops-deploy timer on docker01 never reported a successful run"
