apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  destination:
    namespace: vault
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.34.1
    chart: vault
    plugin:
      env:
        - name: HELM_VALUES
          value: |
            skipVaultPlugin: true
            injector:
              # 7 days at most 64 MiB and 0.007 cores
              resources:
                requests:
                  cpu: 0
                  memory: 0
                limits:
                  cpu: 250m
                  memory: 256Mi
              agentDefaults:
                cpuLimit: "250m"
                cpuRequest: "0"
                memLimit: "64Mi"
                memRequest: "0"
              logFormat: "json"
              affinity: ""
              ui:
                enabled: true
            server:
              # 7 days at most 287 MiB and 0.05 cores. Generous: an OOM kill seals the node until the unsealer reacts.
              resources:
                requests:
                  cpu: 0
                  memory: 0
                limits:
                  cpu: 500m
                  memory: 1Gi
              ha:
                enabled: true
                replicas: 1
                raft:
                  enabled: true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jsonPointers:
        - /webhooks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
