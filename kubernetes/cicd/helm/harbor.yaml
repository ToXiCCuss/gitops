apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: harbor
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://helm.goharbor.io
    targetRevision: 1.19.4
    chart: harbor
    plugin:
      env:
        - name: HELM_VALUES
          value: |
            expose:
              type: clusterIP
              tls:
                enabled: false
            externalURL: https://harbor.k8sdev.rjst.de
            harborAdminPassword: <path:argocd/data/harbor#admin.password>
            core:
              # Single sign-on with Keycloak (realm rjst, client harbor). The local admin stays the emergency access
              # and the account of the k3s image pulls: Harbor always checks admin against its own database.
              # The client roles of harbor arrive as the groups claim: the role admin makes a user a Harbor admin,
              # the role developer is a group that gets its role per project in Harbor.
              configureUserSettings: |
                {"auth_mode": "oidc_auth", "oidc_name": "Keycloak", "oidc_endpoint": "https://auth.proxy.rjst.de/realms/rjst",
                 "oidc_client_id": "harbor", "oidc_client_secret": "<path:argocd/data/harbor#oidc.client_secret>",
                 "oidc_scope": "openid,profile,email", "oidc_verify_cert": true, "oidc_auto_onboard": true,
                 "oidc_user_claim": "preferred_username", "oidc_groups_claim": "roles", "oidc_admin_group": "admin"}
            database:
              type: external
              external:
                host: "docker01.server.lan"
                username: <path:argocd/data/harbor#database.username>
                password: <path:argocd/data/harbor#database.password>
                coreDatabase: "harbor"
              maxIdleConns: 1
              maxOpenConns: 10
            # Starting values without measurements: small requests, memory limits with headroom. Check the real
            # use in the Kubernetes dashboards after the sync and tighten them.
            portal:
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {cpu: 500m, memory: 128Mi}
            core:
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
            jobservice:
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
            registry:
              registry:
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {cpu: "1", memory: 512Mi}
              controller:
                resources:
                  requests: {cpu: 20m, memory: 32Mi}
                  limits: {cpu: 500m, memory: 128Mi}
            trivy:
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
            nginx:
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {cpu: 500m, memory: 128Mi}
            redis:
              internal:
                resources:
                  requests: {cpu: 20m, memory: 64Mi}
                  limits: {cpu: 500m, memory: 256Mi}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
