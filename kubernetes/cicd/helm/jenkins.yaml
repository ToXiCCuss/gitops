apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: jenkins
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://charts.jenkins.io/
    chart: jenkins
    targetRevision: 5.10.0
    plugin:
      env:
        - name: HELM_VALUES
          value: |
            controller:
              jenkinsUrl: "https://jenkins.k8sdev.rjst.de"
              admin:
                password: <path:argocd/data/jenkins#password>
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              # Install the plugins only on the first start of a volume, so that a restart neither downloads nor
              # updates them. A new plugin in this list is then not added to an existing volume, install it in the UI.
              initializeOnce: true
              # Download the plugins from one fixed mirror instead of the random one the update center redirects to.
              # The path must be part of the value, a stalled download on another mirror then cannot hold up the start.
              initContainerEnv:
                - name: JENKINS_UC_DOWNLOAD_URL
                  value: https://ftp.halifax.rwth-aachen.de/jenkins/plugins
              # Added to the plugins of the chart (kubernetes, workflow-aggregator, git, configuration-as-code)
              additionalPlugins:
                - badge
                - github-branch-source
                - pipeline-utility-steps
                - pipeline-stage-view
                - dark-theme
                # Login with Keycloak and the matrix of permissions per group. Not added to an existing volume (initializeOnce):
                # install both once in the UI (Manage Jenkins, Plugins) before the login configuration is deployed.
                - oic-auth
                - matrix-auth
              # Private key of the GitHub App, from Vault via kubernetes/secrets/jenkins-github-app.yaml. It is mounted
              # as a file; the credential that reads it is the ConfigMap kubernetes/cicd/kubectl/jenkins-casc.yaml (a
              # dollar sign in these Helm values would be replaced by ArgoCD, so it cannot be defined here).
              additionalExistingSecrets:
                - name: jenkins-github-app
                  keyName: privateKey
                - name: jenkins-oidc
                  keyName: clientSecret
              JCasC:
                configScripts:
                  shared-library: |
                    unclassified:
                      globalLibraries:
                        libraries:
                          - name: "cicd-library"
                            defaultVersion: "master"
                            implicit: false
                            allowVersionOverride: true
                            includeInChangesets: true
                            retriever:
                              modernSCM:
                                scm:
                                  gitSource:
                                    remote: "https://github.com/RJST-DEVELOP/cicd-library.git"
                                    credentialsId: "github-app"
                  security: |
                    jenkins:
                      securityRealm:
                        oic:
                          # Fixed endpoints instead of the well-known address: the discovery is read when Jenkins starts, with
                          # fixed endpoints Jenkins starts without Keycloak as well. Only the login needs Keycloak then.
                          serverConfiguration:
                            manual:
                              authorizationServerUrl: "https://auth.proxy.rjst.de/realms/rjst/protocol/openid-connect/auth"
                              tokenServerUrl: "https://auth.proxy.rjst.de/realms/rjst/protocol/openid-connect/token"
                              userInfoServerUrl: "https://auth.proxy.rjst.de/realms/rjst/protocol/openid-connect/userinfo"
                              jwksServerUrl: "https://auth.proxy.rjst.de/realms/rjst/protocol/openid-connect/certs"
                              issuer: "https://auth.proxy.rjst.de/realms/rjst"
                              endSessionUrl: "https://auth.proxy.rjst.de/realms/rjst/protocol/openid-connect/logout"
                              scopes: "openid profile email"
                          clientId: "jenkins"
                          # The secret is the file of the Secret jenkins-oidc. A dollar sign is written twice here, ArgoCD turns
                          # $$ into $ and an unknown $NAME into an empty string (see kubernetes/cicd/kubectl/jenkins-casc.yaml).
                          clientSecret: "$${readFile:/run/secrets/additional/jenkins-oidc-clientSecret}"
                          userNameField: "preferred_username"
                          fullNameFieldName: "name"
                          emailFieldName: "email"
                          groupsFieldName: "roles"
                          # Without these two lines an existing realm stays case-insensitive: "Admin" would be the same user as "admin"
                          userIdStrategy: "caseSensitive"
                          groupIdStrategy: "caseSensitive"
                          logoutFromOpenidProvider: true
                          postLogoutRedirectUrl: "https://jenkins.k8sdev.rjst.de/"
                          # The emergency access: the admin of the chart still gets in when Keycloak is not available
                          properties:
                            - escapeHatch:
                                username: "$${chart-admin-username}"
                                secret: "$${chart-admin-password}"
                                group: "admin"
                      # The groups are the client roles of the Keycloak client jenkins. Nobody else gets anything.
                      authorizationStrategy:
                        globalMatrix:
                          entries:
                            - group:
                                name: "admin"
                                permissions:
                                  - "Overall/Administer"
                            - group:
                                name: "user"
                                permissions:
                                  - "Overall/Read"
                                  - "View/Read"
                                  - "Job/Read"
                                  - "Job/Build"
                                  - "Job/Cancel"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
