apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: jenkins
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://charts.jenkins.io/
    chart: jenkins
    targetRevision: 5.9.64
    plugin:
      env:
        - name: HELM_VALUES
          value: |
            controller:
              jenkinsUrl: "https://jenkins.k8sdev.rjst.de"
              admin:
                password: <path:argocd/data/jenkins#password>
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              # Install the plugins only on the first start of a volume, so that a restart neither downloads nor
              # updates them. A new plugin in this list is then not added to an existing volume, install it in the UI.
              initializeOnce: true
              # Download the plugins from one fixed mirror instead of the random one the update center redirects to.
              # The path must be part of the value, a stalled download on another mirror then cannot hold up the start.
              initContainerEnv:
                - name: JENKINS_UC_DOWNLOAD_URL
                  value: https://ftp.halifax.rwth-aachen.de/jenkins/plugins
              # Added to the plugins of the chart (kubernetes, workflow-aggregator, git, configuration-as-code)
              additionalPlugins:
                - badge
                - github-branch-source
                - pipeline-utility-steps
                - pipeline-stage-view
                - dark-theme
              # Private key of the GitHub App, from Vault via kubernetes/secrets/jenkins-github-app.yaml. It is mounted
              # as a file; the credential that reads it is the ConfigMap kubernetes/cicd/kubectl/jenkins-casc.yaml (a
              # dollar sign in these Helm values would be replaced by ArgoCD, so it cannot be defined here).
              additionalExistingSecrets:
                - name: jenkins-github-app
                  keyName: privateKey
              JCasC:
                configScripts:
                  shared-library: |
                    unclassified:
                      globalLibraries:
                        libraries:
                          - name: "cicd-library"
                            defaultVersion: "master"
                            implicit: false
                            allowVersionOverride: true
                            includeInChangesets: true
                            retriever:
                              modernSCM:
                                scm:
                                  gitSource:
                                    remote: "https://github.com/RJST-DEVELOP/cicd-library.git"
                                    credentialsId: "github-app"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
