apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: jenkins
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://charts.jenkins.io/
    chart: jenkins
    targetRevision: 5.9.22
    plugin:
      env:
        - name: HELM_VALUES
          value: |
            controller:
              jenkinsUrl: "http://jenkins.proxy.rjst.de"
              admin:
                password: <path:argocd/data/jenkins#password>
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: "2Gi"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
