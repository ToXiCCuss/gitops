# NetBird groups exist only while this app is deployed (destination k8s-jenkins, users jenkins-users).
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-jenkins
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: k8s-jenkins

---

apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: jenkins-users
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: jenkins-users

---

---

# jenkins: https://jenkins.k8sdev.rjst.de -> jenkins.jenkins:8080
# Own Gateway/Service/listener/NetBird resource per app - see kube-istio-internal.yaml.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: jenkins
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: internal-gateway
  servers:
    - port:
        number: 8447
        name: https-jenkins
        protocol: HTTPS
      hosts:
        - jenkins.k8sdev.rjst.de
      tls:
        mode: SIMPLE
        credentialName: k8sdev-wildcard-tls

---

apiVersion: v1
kind: Service
metadata:
  name: gw-jenkins
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: internal-gateway
    istio: internal-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8447

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: jenkins
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
    - jenkins.k8sdev.rjst.de
  gateways:
    - jenkins
  http:
    - route:
        - destination:
            host: jenkins.jenkins.svc.cluster.local
            port:
              number: 8080

---

apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: gw-jenkins
  namespace: istio-internal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  networkRouterRef:
    name: proxy
    namespace: netbird
  serviceRef:
    name: gw-jenkins
  groups:
    - name: k8s-jenkins
    - name: kubernetes-services

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maven-repo-pvc
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi

---

apiVersion: v1
kind: Secret
metadata:
  name: maven-settings-secret
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "3"
type: Opaque
stringData:
  settings.xml: |
    <settings>
        <servers>
            <server>
                <id>local-rjst</id>
                <username>XXX</username>
                <password>XXX</password>
                <configuration>
                    <httpConfiguration>
                        <all>
                            <connectionTimeout>120000</connectionTimeout>
                            <readTimeout>120000</readTimeout>
                        </all>
                    </httpConfiguration>
                </configuration>
            </server>
        </servers>
    </settings>
