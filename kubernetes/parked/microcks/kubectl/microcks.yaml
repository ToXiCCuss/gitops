apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: microcks
  namespace: microcks
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "microcks.rjst.de"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        credentialName: microcks-cert
        mode: SIMPLE
      hosts:
        - "microcks.rjst.de"

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: microcks-cert
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: microcks-cert
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: "microcks.rjst.de"
  dnsNames:
    - "microcks.rjst.de"

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: microcks
  namespace: microcks
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
    - "microcks.rjst.de"
  gateways:
    - microcks
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: microcks
            port:
              number: 8080
