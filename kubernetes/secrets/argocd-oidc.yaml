# Client secret of the Keycloak client argocd. Read by Argo CD through the reference in oidc.config
# (kubernetes/argocd-values.yaml), which only works with the label part-of. The same value is the secret of the
# client in Keycloak (Vault docker/keycloak-config, ARGOCD_CLIENT_SECRET).
apiVersion: v1
kind: Secret
metadata:
  name: argocd-oidc
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    avp.kubernetes.io/path: "argocd/data/argocd"
type: Opaque
stringData:
  clientSecret: <oidc.client_secret>
