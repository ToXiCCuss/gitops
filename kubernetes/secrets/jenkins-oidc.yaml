# Client secret of the Keycloak client jenkins. Mounted into the Jenkins controller (additionalExistingSecrets in
# kubernetes/cicd/helm/jenkins.yaml) and read by the login configuration there. The same value is the secret of the
# client in Keycloak (Vault docker/keycloak-config, JENKINS_CLIENT_SECRET).
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-oidc
  namespace: jenkins
  annotations:
    avp.kubernetes.io/path: "argocd/data/jenkins"
type: Opaque
stringData:
  clientSecret: <oidc.client_secret>
