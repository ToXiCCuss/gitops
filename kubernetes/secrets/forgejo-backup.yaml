# Environment of the CronJob forgejo-backup (kubernetes/cicd/kubectl/forgejo-backup.yaml): the restic password of the
# repository forgejo/restic, the keys of the RustFS identity forgejo and the database login of Forgejo.
# generate-secrets.ps1 fills argocd/data/forgejo (it copies the S3 keys from docker/s3/forgejo).
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-backup
  namespace: forgejo
  annotations:
    avp.kubernetes.io/path: "argocd/data/forgejo"
type: Opaque
stringData:
  RESTIC_PASSWORD: <backup.restic_password>
  AWS_ACCESS_KEY_ID: <backup.s3_access_key>
  AWS_SECRET_ACCESS_KEY: <backup.s3_secret_key>
  PGUSER: <database.username>
  PGPASSWORD: <database.password>
