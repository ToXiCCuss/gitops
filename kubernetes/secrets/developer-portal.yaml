# Environment of the Developer Portal (the chart reads it with extraEnvVarsSecrets: [developer-portal], see the
# repository developer-portal).
# A missing key in Vault silently drops the whole Secret, so all keys must exist before the sync. The Keycloak client
# developer-portal has the same client secret (Vault docker/keycloak-config, DEVELOPER_PORTAL_CLIENT_SECRET). The GITHUB_APP_*
# values are the GitHub App rjst-developer-portal (read-only: Contents and Metadata, installed on selected repositories of
# RJST-DEVELOP) that the catalog uses to read the catalog-info.yaml of the own apps. The private key is the PEM of the App.
apiVersion: v1
kind: Secret
metadata:
  name: developer-portal
  namespace: developer-portal
  annotations:
    avp.kubernetes.io/path: "argocd/data/developer-portal"
type: Opaque
stringData:
  POSTGRES_USER: <database.username>
  POSTGRES_PASSWORD: <database.password>
  AUTH_OIDC_CLIENT_SECRET: <oidc.client_secret>
  BACKEND_SECRET: <backend.secret>
  GITHUB_APP_ID: <github_app.id>
  GITHUB_APP_CLIENT_ID: <github_app.client_id>
  GITHUB_APP_CLIENT_SECRET: <github_app.client_secret>
  GITHUB_APP_WEBHOOK_SECRET: <github_app.webhook_secret>
  GITHUB_APP_PRIVATE_KEY: <github_app.private_key>
