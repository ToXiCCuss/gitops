# Password of the user default of Valkey (kubernetes/infra/helm/valkey.yaml, auth.usersExistingSecret): the chart reads
# it from the key named after the user. The apps use the same password at valkey.valkey.svc.cluster.local:6379.
# scripts/vault/Generate-Secrets.ps1 creates argocd/data/valkey (password) before the merge, see docs/vault.md.
apiVersion: v1
kind: Secret
metadata:
  name: valkey-users
  namespace: valkey
  annotations:
    avp.kubernetes.io/path: "argocd/data/valkey"
type: Opaque
stringData:
  default: <password>
