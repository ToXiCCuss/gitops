# Environment of Leantime (kubernetes/management/kubectl/leantime.yaml). The Keycloak client leantime has the same
# client secret (Vault docker/keycloak-config, LEANTIME_CLIENT_SECRET). A new value of session.password logs everyone out.
apiVersion: v1
kind: Secret
metadata:
  name: leantime
  namespace: leantime
  annotations:
    avp.kubernetes.io/path: "argocd/data/leantime"
type: Opaque
stringData:
  LEAN_DB_USER: <database.username>
  LEAN_DB_PASSWORD: <database.password>
  LEAN_SESSION_PASSWORD: <session.password>
  LEAN_OIDC_CLIENT_SECRET: <oidc.client_secret>
