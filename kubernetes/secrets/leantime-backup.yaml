# Environment of the suspended leantime-restore CronJob (kubernetes/management/kubectl/leantime-restore.yaml):
# the restic password of the retained repository leantime/restic and the keys of the RustFS identity leantime.
# docs/vault.md (Secrets) fills argocd/data/leantime (it copies the S3 keys from docker/s3/leantime).
apiVersion: v1
kind: Secret
metadata:
  name: leantime-backup
  namespace: leantime
  annotations:
    avp.kubernetes.io/path: "argocd/data/leantime"
type: Opaque
stringData:
  RESTIC_PASSWORD: <backup.restic_password>
  AWS_ACCESS_KEY_ID: <backup.s3_access_key>
  AWS_SECRET_ACCESS_KEY: <backup.s3_secret_key>
