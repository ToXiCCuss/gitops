# Environment of the CronJobs leantime-backup and leantime-restore (kubernetes/management/kubectl/leantime-backup.yaml):
# the restic password of the repository leantime/restic and the keys of the RustFS identity leantime.
# generate-secrets.ps1 fills argocd/data/leantime (it copies the S3 keys from docker/s3/leantime).
apiVersion: v1
kind: Secret
metadata:
  name: leantime-backup
  namespace: leantime
  annotations:
    avp.kubernetes.io/path: "argocd/data/leantime"
type: Opaque
stringData:
  RESTIC_PASSWORD: <backup.restic_password>
  AWS_ACCESS_KEY_ID: <backup.s3_access_key>
  AWS_SECRET_ACCESS_KEY: <backup.s3_secret_key>
