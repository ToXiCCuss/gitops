# Environment of the CronJob vault-backup (kubernetes/infra/kubectl/kube-vault-backup.yaml): the periodic token of the
# policy vault_snapshot, the restic password of the repository vault/raft and the keys of the RustFS identity vault.
# Fill Vault `argocd/data/vault-backup` before the cutover (docs/backup-services.md). While a key is missing, AVP
# leaves this Secret out without an error.
apiVersion: v1
kind: Secret
metadata:
  name: vault-backup
  namespace: vault
  annotations:
    avp.kubernetes.io/path: "argocd/data/vault-backup"
type: Opaque
stringData:
  VAULT_TOKEN: <token>
  RESTIC_PASSWORD: <restic_password>
  AWS_ACCESS_KEY_ID: <s3_access_key>
  AWS_SECRET_ACCESS_KEY: <s3_secret_key>
