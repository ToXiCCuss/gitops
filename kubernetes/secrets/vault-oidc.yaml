# Client secret of the Keycloak client vault. Read by the OIDC config resources of the vault-config-operator
# (kubernetes/infra/kubectl/kube-vault-config-oidc-test.yaml), so that the operator needs no read right on this path in Vault.
# The same value is the secret of the client in Keycloak (Vault docker/keycloak-config, VAULT_CLIENT_SECRET).
apiVersion: v1
kind: Secret
metadata:
  name: vault-oidc
  namespace: vault
  annotations:
    avp.kubernetes.io/path: "argocd/data/vault"
type: Opaque
stringData:
  clientSecret: <oidc.client_secret>
