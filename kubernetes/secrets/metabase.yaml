apiVersion: v1
kind: Secret
metadata:
  name: metabase
  namespace: metabase
  annotations:
    avp.kubernetes.io/path: "argocd/data/metabase"
type: Opaque
stringData:
  MB_DB_USER: <database.username>
  MB_DB_PASS: <database.password>
  # Keep this key across upgrades/restores: it encrypts saved data-source credentials.
  MB_ENCRYPTION_SECRET_KEY: <encryption.secret_key>
