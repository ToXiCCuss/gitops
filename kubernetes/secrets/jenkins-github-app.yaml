# Private key of the GitHub App that Jenkins uses (PKCS#8 PEM, see README, Jenkins). Mounted into the
# Jenkins controller and read by the JCasC credential "github-app" in kubernetes/cicd/helm/jenkins.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-github-app
  namespace: jenkins
  annotations:
    avp.kubernetes.io/path: "argocd/data/jenkins"
type: Opaque
stringData:
  privateKey: <github_app_private_key>
