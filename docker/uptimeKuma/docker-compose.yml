services:
  uptimeKuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    restart: unless-stopped
    volumes:
      - /root/docker/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    labels:
      # Link on the portal page (kubernetes/management/kubectl/portal.yaml)
      portal.name: "Uptime Kuma"
      portal.port: "3001"
      portal.group: "Monitoring"
      portal.description: "Erreichbarkeit der Dienste"
      portal.icon: "🟢"
