services:
  offsite-sync:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    container_name: offsite-sync
    # The S3 keys come from Vault (docker/s3/offsite-sync, written to vault.env by scripts/docker/deploy.sh), override.env is optional
    env_file:
      - "default.env"
      - path: "override.env"
        required: false
      - path: "/run/gitops/offsite-sync/vault.env"
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The host DNS is the NetBird resolver (100.x), which containers cannot reach
    dns:
      - 1.1.1.1
      - 9.9.9.9
    entrypoint: ["/bin/sh", "/sync.sh"]
    volumes:
      - ./sync.sh:/sync.sh:ro
      # rclone.conf with the pCloud remote (only this container holds the pCloud credentials)
      - /root/docker/offsite-sync/rclone:/config/rclone
      # Textfile collector of the node_exporter: the sync leaves the time of its last success there
      - /var/lib/prometheus/node-exporter:/metrics
    restart: unless-stopped
