services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.14.0@sha256:0badfe4609da641341b630c5db22d1aa86e31b40af657f6ee3e28e59d504d9a6
    container_name: arcane
    # host.docker.internal points to the Docker host, where the SeaweedFS S3 listens (system backup of Arcane)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # As in the installation guide of Arcane (https://getarcane.app/docs/get-started/installation)
    cgroup: host
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/docker/arcane/data:/app/data
      - /root/docker/arcane/backups:/backups
    env_file:
      - "default.env"
      - "override.env"
    restart: unless-stopped
