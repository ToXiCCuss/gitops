services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.10.1@sha256:5695ac9b3ffb4dc8ac33030e92c87f2fa64f431b03d63605316af0cb713156de
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/docker/arcane/data:/app/data
      - /root/docker/arcane/backups:/backups
    env_file:
      - "default.env"
      - "override.env"
    restart: unless-stopped
