services:
  freewar-chaos-service:
    image: freewar-chaos-service:0.0.1-SNAPSHOT
    container_name: freewar-chaos-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Berlin
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/fw_chaos

