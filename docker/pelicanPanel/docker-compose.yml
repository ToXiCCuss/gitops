services:
  panel:
    container_name: pelican_panel
    image: ghcr.io/pelican/panel:v1.0.0-rc.2@sha256:cb717c15da9bcdc93f22a22a02d5460a1ce51fd03f2975b4ce53d745f4cc9ac8
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    volumes:
      - pelican_data:/pelican-data
      - pelican_logs:/var/www/html/storage/logs
    environment:
      XDG_DATA_HOME: "/pelican-data"
      APP_TIMEZONE: Europe/Berlin
      APP_URL: "https://webinterface.proxy.rjst.de"
      BEHIND_PROXY: "true"
      TRUSTED_PROXIES: "100.67.0.0/16"
      APP_DEBUG: "false"
      APP_ENV: "production"
    ports:
      - "81:80"
    labels:
      # Link on the portal page (kubernetes/management/kubectl/portal.yaml)
      portal.name: "Pelican Panel"
      portal.url: "https://webinterface.proxy.rjst.de"
      portal.group: "Management"
      portal.public: "true"
      portal.description: "Game server management"
      portal.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/pelican-panel.svg"

volumes:
  pelican_data:
    name: pelican_panel_data
  pelican_logs:
    name: pelican_panel_logs
