services:
  backrest:
    image: garethgeorge/backrest:v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
    container_name: backrest
    hostname: backrest-docker
    env_file:
      - "default.env"
      - ".env"
    # The host DNS is the NetBird resolver (100.x), which containers cannot reach (needed for pCloud restores)
    dns:
      - 1.1.1.1
      - 9.9.9.9
    # host.docker.internal points to the Docker host, where the SeaweedFS S3 listens
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9898:9898"
    volumes:
      # Backrest state (config.json, operation log), cache and rclone.conf (pCloud remote)
      - /root/docker/backrest/data:/data
      - /root/docker/backrest/config:/config
      - /root/docker/backrest/cache:/cache
      - /root/docker/backrest/rclone:/root/.config/rclone
      # Backup sources, read-only. The plan only takes static files (keys, config), see the README.
      # Never the data directories of running databases, they are not consistent when copied.
      - /root/docker:/userdata/docker:ro
      # Only restore target that is writable
      - /root/docker/backrest/restore:/restore
    restart: unless-stopped
