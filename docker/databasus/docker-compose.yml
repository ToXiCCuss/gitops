services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.60.0@sha256:2e9aec567de7ed3f0c8f360ea72abe6a8425704d9272232dae4325ad920b9204
    # host.docker.internal points to the Docker host, where PostgreSQL runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4005:4005"
    labels:
      # Link on the portal page (kubernetes/infra/kubectl/kube-portal.yaml)
      portal.name: "Databasus"
      portal.url: "https://databasus.proxy.rjst.de"
      portal.group: "Backup"
      portal.description: "Datenbank-Backups"
    volumes:
      - /root/docker/databasus:/databasus-data
    restart: unless-stopped
