services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.64.0@sha256:a4bbf8b285c54f76c61a997d604cb22d7f53a01fe72b644a8abdb9b5b4cc82a5
    # host.docker.internal points to the Docker host, where PostgreSQL runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4005:4005"
    labels:
      # Link on the portal page (kubernetes/management/kubectl/portal.yaml)
      portal.name: "Databasus"
      portal.url: "https://databasus.proxy.rjst.de"
      portal.group: "Backup"
      portal.description: "Database backups"
      portal.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/databasus.svg"
    volumes:
      - /root/docker/databasus:/databasus-data
    # A process in the container cannot gain more privileges than it started with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
