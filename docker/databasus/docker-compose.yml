services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.62.0@sha256:04f63c57af364c82219a03a45be76699014117ba715ff1f17cf1e3c6fc6e5419
    # host.docker.internal points to the Docker host, where PostgreSQL runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4005:4005"
    labels:
      # Link on the portal page (kubernetes/management/kubectl/portal.yaml)
      portal.name: "Databasus"
      portal.url: "https://databasus.proxy.rjst.de"
      portal.group: "Backup"
      portal.description: "Database backups"
      portal.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/databasus.svg"
    volumes:
      - /root/docker/databasus:/databasus-data
    restart: unless-stopped
