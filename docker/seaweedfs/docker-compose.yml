services:
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: seaweedfs
    # Master, volume server, filer and S3 gateway in one process. Only the S3 port is published,
    # the filer has no authentication. Access is controlled by the identities in s3.json.
    command: ["server", "-dir=/data", "-filer", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    restart: unless-stopped
    volumes:
      - "/root/docker/seaweedfs:/data"
      # Generated by scripts/docker/setup-backup-host.sh, contains the S3 secrets, never in git
      - "/root/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"
