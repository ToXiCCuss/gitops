services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: seaweedfs
    # The default command of the image is `weed mini` (master, volume server, filer and S3 in one process),
    # this is also what this project ran before. The S3 port and the admin UI are published, the filer has no
    # authentication and stays closed. Access to S3 is controlled by the identities in s3.json. The admin UI
    # asks for the login of default.env / override.env (WEED_ADMIN_*), use only the read-only account.
    env_file:
      - "default.env"
      - "override.env"
    command:
      - "mini"
      - "-s3.config=/etc/seaweedfs/s3.json"
      - "-bucket=backups,databases,vault,pelican,netbird"
      - "-webdav=false"
      - "-s3.port.iceberg=0"
      - "-s3.port.lance=0"
    ports:
      - "8333:8333"
      - "23646:23646"
    labels:
      # Link on the portal page (kubernetes/management/kubectl/portal.yaml). The NetBird reverse proxy s3-admin.proxy.rjst.de
      # points to the admin UI of SeaweedFS (23646) or of the RustFS trial (docker/rustfs, 9001): only this entry lists it
      portal.name: "S3 Admin"
      portal.url: "https://s3-admin.proxy.rjst.de"
      portal.group: "Backup"
      portal.description: "S3-Speicher"
      # Neither SeaweedFS nor RustFS fits both: the generic S3 symbol (the portal shows it on a white background)
      portal.icon: "https://cdn.jsdelivr.net/npm/simple-icons/icons/amazons3.svg"
    restart: unless-stopped
    volumes:
      - "/root/docker/seaweedfs:/data"
      # Generated by scripts/docker/setup-backup-host.sh, contains the S3 secrets, never in git
      - "/root/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"
