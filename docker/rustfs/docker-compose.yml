services:
  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: rustfs
    # The local S3 of all backups. Buckets, users and policies: scripts/docker/setup-rustfs.sh. The console logs in with Keycloak
    # (RUSTFS_IDENTITY_OPENID_*).
    # The secrets come from Vault (docker/rustfs), scripts/docker/deploy.sh writes them to vault.env before it starts the project.
    # The file is optional so that docker compose logs/ps work without it. Deploy only with deploy.sh
    env_file:
      - "default.env"
      - path: "/run/gitops/rustfs/vault.env"
        required: false
    # The host DNS is the NetBird resolver (100.x), which containers cannot reach (RustFS must resolve auth.proxy.rjst.de)
    dns:
      - 1.1.1.1
      - 9.9.9.9
    # host.docker.internal points to the Docker host, where Keycloak listens on 8180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # S3 API
      - "9000:9000"
      # Console
      - "9001:9001"
    volumes:
      # Owned by 10001:10001, the runtime user of the image (pre-deploy.sh)
      - /root/docker/rustfs/data:/data
      - /root/docker/rustfs/logs:/app/logs
    labels:
      # Link on the portal page (kubernetes/management/kubectl/portal.yaml). The NetBird reverse proxy s3-admin.proxy.rjst.de
      # points to the console (9001)
      portal.name: "RustFS"
      portal.url: "https://s3-admin.proxy.rjst.de"
      portal.group: "Backup"
      portal.description: "S3 storage"
      portal.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/rustfs.svg"
    # A process in the container cannot gain more privileges than it started with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
