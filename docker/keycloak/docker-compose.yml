services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3@sha256:5fdbf2dbb5897cc34e82de49d13e23db011f9925089dbc555fc095f2c8bc1dac
    container_name: keycloak
    command: ["start"]
    # The secrets come from Vault (docker/keycloak), scripts/docker/deploy.sh writes them to vault.env before it starts the project.
    # The file is optional so that docker compose logs/ps work without it. Deploy only with deploy.sh
    env_file:
      - "default.env"
      - path: "/run/gitops/keycloak/vault.env"
        required: false
    # host.docker.internal points to the Docker host, where PostgreSQL runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8180:8080"
    labels:
      # Link on the portal page (kubernetes/management/kubectl/portal.yaml)
      portal.name: "Keycloak"
      portal.url: "https://auth.proxy.rjst.de"
      portal.group: "Platform"
      portal.description: "Login and identities"
      portal.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/keycloak.svg"
    # A process in the container cannot gain more privileges than it started with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

# A fixed network name, so that the job of docker/keycloak-config reaches Keycloak as http://keycloak:8080
networks:
  default:
    name: keycloak
