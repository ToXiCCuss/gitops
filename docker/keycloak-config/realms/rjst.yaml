# The realm of the apps. Users and their passwords are not in here: they are created in the Keycloak UI
# and live in the database (backed up by restic-backup). Everything else about the login of the apps is defined here.
realm: rjst
enabled: true
displayName: RJST
registrationAllowed: false
loginWithEmailAllowed: true
bruteForceProtected: true
sslRequired: external

# The permissions are set per app: every app has its own client roles, a user gets the roles of the apps he may use
# (UI: Users > Role mapping > Client roles, or a group that carries the roles). A user without a role of an app
# is refused by that app. The roles of a client end up in its token as the claim "roles" (mapper of the client).
roles:
  client:
    grafana:
      - name: admin
        description: Grafana Admin
      - name: editor
        description: Grafana Editor
      - name: viewer
        description: Grafana Viewer
    # admin makes a Harbor admin. developer arrives as a group, its role per project is set in Harbor.
    harbor:
      - name: admin
        description: Harbor system admin
      - name: developer
        description: Harbor group developer
    # Vault: admin may do everything, developer may read and write the secrets in dev/ and prod/. The roles are external groups
    # with a policy each in Vault (scripts/vault/configure-vault-oidc.ps1).
    vault:
      - name: admin
        description: Vault administrator
      - name: developer
        description: Vault developer, reads and writes dev/ and prod/
    # admin may administer Jenkins, user may look at jobs and build them (the matrix in kubernetes/cicd/helm/jenkins.yaml)
    jenkins:
      - name: admin
        description: Jenkins administrator
      - name: user
        description: Jenkins user, looks at jobs and builds them
    # The role names are the policies of RustFS: consoleAdmin may do everything, readwrite and readonly work on the buckets
    rustfs:
      - name: consoleAdmin
        description: RustFS administrator
      - name: readwrite
        description: RustFS, reads and writes objects
      - name: readonly
        description: RustFS, read only
    # admin makes a Forgejo site admin, user may log in (publish and read packages). Forgejo refuses a user without a role
    # (required claim roles of the auth source keycloak in kubernetes/cicd/helm/forgejo.yaml)
    forgejo:
      - name: admin
        description: Forgejo site admin
      - name: user
        description: Forgejo user, publishes and reads packages
    # admin may do everything, viewer only looks at the Applications (configs.rbac in kubernetes/argocd-values.yaml).
    # Argo CD lets a user without a role log in, but shows nothing to him.
    argocd:
      - name: admin
        description: Argo CD administrator
      - name: viewer
        description: Argo CD viewer, read only

clients:
  - clientId: grafana
    name: Grafana
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:GRAFANA_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://grafana.k8sdev.rjst.de
    redirectUris:
      - https://grafana.k8sdev.rjst.de/login/generic_oauth
    webOrigins:
      - https://grafana.k8sdev.rjst.de
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: grafana-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: grafana
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: harbor
    name: Harbor
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:HARBOR_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://harbor.k8sdev.rjst.de
    redirectUris:
      - https://harbor.k8sdev.rjst.de/c/oidc/callback
    webOrigins:
      - https://harbor.k8sdev.rjst.de
    protocolMappers:
      - name: harbor-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: harbor
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: jenkins
    name: Jenkins
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:JENKINS_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://jenkins.k8sdev.rjst.de
    redirectUris:
      - https://jenkins.k8sdev.rjst.de/securityRealm/finishLogin
    webOrigins:
      - https://jenkins.k8sdev.rjst.de
    attributes:
      # Where Keycloak may send the user after the logout of Jenkins
      post.logout.redirect.uris: https://jenkins.k8sdev.rjst.de/*
    protocolMappers:
      - name: jenkins-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: jenkins
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: vault
    name: Vault
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:VAULT_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://vault.k8sdev.rjst.de
    redirectUris:
      # The UI and the command line (vault login -method=oidc)
      - https://vault.k8sdev.rjst.de/ui/vault/auth/oidc/oidc/callback
      - http://localhost:8250/oidc/callback
    webOrigins:
      - https://vault.k8sdev.rjst.de
    protocolMappers:
      - name: vault-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: vault
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: rustfs
    name: RustFS
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:RUSTFS_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://s3-admin.proxy.rjst.de
    redirectUris:
      - https://s3-admin.proxy.rjst.de/rustfs/admin/v3/oidc/callback/default
    webOrigins:
      - https://s3-admin.proxy.rjst.de
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: rustfs-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: rustfs
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: forgejo
    name: Forgejo
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:FORGEJO_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://forgejo.k8sdev.rjst.de
    redirectUris:
      # The path ends in the name of the auth source in Forgejo (keycloak)
      - https://forgejo.k8sdev.rjst.de/user/oauth2/keycloak/callback
    webOrigins:
      - https://forgejo.k8sdev.rjst.de
    protocolMappers:
      - name: forgejo-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: forgejo
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      # Forgejo names a new user after the claim nickname (oauth2_client USERNAME in kubernetes/cicd/helm/forgejo.yaml), Keycloak leaves it empty
      # by default: fill it with the Keycloak username
      - name: forgejo-nickname
        protocol: openid-connect
        protocolMapper: oidc-usermodel-property-mapper
        config:
          user.attribute: username
          claim.name: nickname
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  # No client roles: Leantime reads no role claim, it matches the user by the verified email (kubernetes/management/kubectl/leantime.yaml)
  - clientId: leantime
    name: Leantime
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:LEANTIME_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://leantime.k8sdev.rjst.de
    redirectUris:
      - https://leantime.k8sdev.rjst.de/oidc/callback
    webOrigins:
      - https://leantime.k8sdev.rjst.de

  - clientId: argocd
    name: Argo CD
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:ARGOCD_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://argocd.k8sdev.rjst.de
    redirectUris:
      - https://argocd.k8sdev.rjst.de/auth/callback
    webOrigins:
      - https://argocd.k8sdev.rjst.de
    protocolMappers:
      - name: argocd-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: argocd
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"


  # No client roles: the Developer Portal (Backstage) signs everyone in who exists in the realm, the permissions follow there
  - clientId: developer-portal
    name: Developer Portal
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:DEVELOPER_PORTAL_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://developer-portal.k8sdev.rjst.de
    redirectUris:
      - https://developer-portal.k8sdev.rjst.de/api/auth/oidc/handler/frame
    webOrigins:
      - https://developer-portal.k8sdev.rjst.de
