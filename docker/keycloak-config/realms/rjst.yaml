# The realm of the apps. Users and their passwords are not in here: they are created in the Keycloak UI
# and live in the database (Databasus). Everything else about the login of the apps is defined here.
realm: rjst
enabled: true
displayName: RJST
registrationAllowed: false
loginWithEmailAllowed: true
bruteForceProtected: true
sslRequired: external

# The permissions are set per app: every app has its own client roles, a user gets the roles of the apps he may use
# (UI: Users > Role mapping > Client roles, or a group that carries the roles). A user without a role of an app
# is refused by that app. The roles of a client end up in its token as the claim "roles" (mapper of the client).
roles:
  client:
    grafana:
      - name: admin
        description: Grafana Admin
      - name: editor
        description: Grafana Editor
      - name: viewer
        description: Grafana Viewer
    # admin makes a Harbor admin. developer arrives as a group, its role per project is set in Harbor.
    harbor:
      - name: admin
        description: Harbor system admin
      - name: developer
        description: Harbor group developer
    # admin may administer Jenkins, user may look at jobs and build them (the matrix in kubernetes/cicd/helm/jenkins.yaml)
    jenkins:
      - name: admin
        description: Jenkins administrator
      - name: user
        description: Jenkins user, looks at jobs and builds them
    # viewer may look at the applications, admin may also run actions (loggers, shutdown) in Spring Boot Admin
    sba-service-dev:
      - name: viewer
        description: Spring Boot Admin dev, read only
      - name: admin
        description: Spring Boot Admin dev, actions
    sba-service-prod:
      - name: viewer
        description: Spring Boot Admin prod, read only
      - name: admin
        description: Spring Boot Admin prod, actions

clients:
  - clientId: grafana
    name: Grafana
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:GRAFANA_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://grafana.k8sdev.rjst.de
    redirectUris:
      - https://grafana.k8sdev.rjst.de/login/generic_oauth
    webOrigins:
      - https://grafana.k8sdev.rjst.de
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: grafana-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: grafana
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: harbor
    name: Harbor
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:HARBOR_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://harbor.k8sdev.rjst.de
    redirectUris:
      - https://harbor.k8sdev.rjst.de/c/oidc/callback
    webOrigins:
      - https://harbor.k8sdev.rjst.de
    protocolMappers:
      - name: harbor-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: harbor
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: sba-service-dev
    name: Spring Boot Admin (dev)
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:SBA_DEV_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://sba-service-dev.k8sdev.rjst.de
    redirectUris:
      - https://sba-service-dev.k8sdev.rjst.de/login/oauth2/code/keycloak
    webOrigins:
      - https://sba-service-dev.k8sdev.rjst.de
    attributes:
      # Where Keycloak may send the user after the logout of the application (the start page of the stage)
      post.logout.redirect.uris: https://sba-service-dev.k8sdev.rjst.de/*
    protocolMappers:
      - name: sba-service-dev-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: sba-service-dev
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: sba-service-prod
    name: Spring Boot Admin (prod)
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:SBA_PROD_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://sba-service-prod.k8sdev.rjst.de
    redirectUris:
      - https://sba-service-prod.k8sdev.rjst.de/login/oauth2/code/keycloak
    webOrigins:
      - https://sba-service-prod.k8sdev.rjst.de
    attributes:
      # Where Keycloak may send the user after the logout of the application (the start page of the stage)
      post.logout.redirect.uris: https://sba-service-prod.k8sdev.rjst.de/*
    protocolMappers:
      - name: sba-service-prod-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: sba-service-prod
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: jenkins
    name: Jenkins
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:JENKINS_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://jenkins.k8sdev.rjst.de
    redirectUris:
      - https://jenkins.k8sdev.rjst.de/securityRealm/finishLogin
    webOrigins:
      - https://jenkins.k8sdev.rjst.de
    attributes:
      # Where Keycloak may send the user after the logout of Jenkins
      post.logout.redirect.uris: https://jenkins.k8sdev.rjst.de/*
    protocolMappers:
      - name: jenkins-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: jenkins
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
