# The realm of the apps. Users and their passwords are not in here: they are created in the Keycloak UI
# and live in the database (Databasus). Everything else about the login of the apps is defined here.
realm: rjst
enabled: true
displayName: RJST
registrationAllowed: false
loginWithEmailAllowed: true
bruteForceProtected: true
sslRequired: external

# The permissions are set per app: every app has its own client roles, a user gets the roles of the apps he may use
# (UI: Users > Role mapping > Client roles, or a group that carries the roles). A user without a role of an app
# is refused by that app. The roles of a client end up in its token as the claim "roles" (mapper of the client).
roles:
  client:
    grafana:
      - name: admin
        description: Grafana Admin
      - name: editor
        description: Grafana Editor
      - name: viewer
        description: Grafana Viewer
    # admin makes a Harbor admin. developer arrives as a group, its role per project is set in Harbor.
    harbor:
      - name: admin
        description: Harbor system admin
      - name: developer
        description: Harbor group developer
    # Vault: admin may do everything, developer may read and write the secrets in dev/ and prod/. The roles are external groups
    # with a policy each in Vault (scripts/vault/configure-vault-oidc.ps1).
    vault:
      - name: admin
        description: Vault administrator
      - name: developer
        description: Vault developer, reads and writes dev/ and prod/
    # admin may administer Jenkins, user may look at jobs and build them (the matrix in kubernetes/cicd/helm/jenkins.yaml)
    jenkins:
      - name: admin
        description: Jenkins administrator
      - name: user
        description: Jenkins user, looks at jobs and builds them
    # The role names are the policies of RustFS: consoleAdmin may do everything, readwrite and readonly work on the buckets
    rustfs:
      - name: consoleAdmin
        description: RustFS administrator
      - name: readwrite
        description: RustFS, reads and writes objects
      - name: readonly
        description: RustFS, read only

clients:
  - clientId: grafana
    name: Grafana
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:GRAFANA_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://grafana.k8sdev.rjst.de
    redirectUris:
      - https://grafana.k8sdev.rjst.de/login/generic_oauth
    webOrigins:
      - https://grafana.k8sdev.rjst.de
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: grafana-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: grafana
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: harbor
    name: Harbor
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:HARBOR_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://harbor.k8sdev.rjst.de
    redirectUris:
      - https://harbor.k8sdev.rjst.de/c/oidc/callback
    webOrigins:
      - https://harbor.k8sdev.rjst.de
    protocolMappers:
      - name: harbor-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: harbor
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: jenkins
    name: Jenkins
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:JENKINS_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://jenkins.k8sdev.rjst.de
    redirectUris:
      - https://jenkins.k8sdev.rjst.de/securityRealm/finishLogin
    webOrigins:
      - https://jenkins.k8sdev.rjst.de
    attributes:
      # Where Keycloak may send the user after the logout of Jenkins
      post.logout.redirect.uris: https://jenkins.k8sdev.rjst.de/*
    protocolMappers:
      - name: jenkins-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: jenkins
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: vault
    name: Vault
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:VAULT_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://vault.k8sdev.rjst.de
    redirectUris:
      # The UI and the command line (vault login -method=oidc)
      - https://vault.k8sdev.rjst.de/ui/vault/auth/oidc/oidc/callback
      - http://localhost:8250/oidc/callback
    webOrigins:
      - https://vault.k8sdev.rjst.de
    protocolMappers:
      - name: vault-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: vault
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  - clientId: rustfs
    name: RustFS
    protocol: openid-connect
    enabled: true
    publicClient: false
    secret: $(env:RUSTFS_CLIENT_SECRET)
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://s3-admin.proxy.rjst.de
    redirectUris:
      - https://s3-admin.proxy.rjst.de/rustfs/admin/v3/oidc/callback/default
    webOrigins:
      - https://s3-admin.proxy.rjst.de
    attributes:
      pkce.code.challenge.method: S256
    protocolMappers:
      - name: rustfs-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: rustfs
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
