services:
  # One-shot job: reads realms/*.yaml, applies them to Keycloak through the admin API and exits.
  # deploy.sh starts it again on every run, the import is idempotent. Check the result with:
  #   docker logs keycloak-config
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    container_name: keycloak-config
    # The secrets come from Vault (docker/keycloak-config), scripts/docker/deploy.sh writes them to vault.env before it starts the project.
    # The file is optional so that docker compose logs/ps work without it. Deploy only with deploy.sh
    env_file:
      - "default.env"
      - path: "/run/gitops/keycloak-config/vault.env"
        required: false
    volumes:
      - ./realms:/config:ro
    # A process in the container cannot gain more privileges than it started with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    restart: "no"

# The network of the keycloak project, so that the job reaches Keycloak as http://keycloak:8080
# without a published port or a firewall rule.
networks:
  default:
    name: keycloak
    external: true
