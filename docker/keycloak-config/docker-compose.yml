services:
  # One-shot job: reads realms/*.yaml, applies them to Keycloak through the admin API and exits.
  # deploy.sh starts it again on every run, the import is idempotent. Check the result with:
  #   docker logs keycloak-config
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    container_name: keycloak-config
    env_file:
      - "default.env"
      - "override.env"
    volumes:
      - ./realms:/config:ro
    restart: "no"

# The network of the keycloak project, so that the job reaches Keycloak as http://keycloak:8080
# without a published port or a firewall rule.
networks:
  default:
    name: keycloak
    external: true
