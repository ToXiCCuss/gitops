services:
  vault-backup:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: vault-backup
    # The secrets come from Vault (docker/vault-backup), scripts/docker/deploy.sh writes them to vault.env before it starts the project.
    # The file is optional so that docker compose logs/ps work without it. Deploy only with deploy.sh
    env_file:
      - "default.env"
      - path: "/run/gitops/vault-backup/vault.env"
        required: false
    # Host network: the container uses the resolver of the host (NetBird DNS, needed for
    # vault.k8sdev.rjst.de, which containers on the bridge cannot reach) and reaches the S3 on 127.0.0.1
    network_mode: host
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      # Textfile collector of the node_exporter: the backup leaves the time of its last success there
      - /var/lib/prometheus/node-exporter:/metrics
    # A process in the container cannot gain more privileges than it started with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
