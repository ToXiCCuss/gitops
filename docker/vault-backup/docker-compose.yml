services:
  vault-backup:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    container_name: vault-backup
    env_file:
      - "default.env"
      - ".env"
    # Host network: the container uses the resolver of the host (NetBird DNS, needed for
    # vault.k8sdev.rjst.de, which containers on the bridge cannot reach) and reaches the S3 on 127.0.0.1
    network_mode: host
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
    restart: unless-stopped
