# Declared state of the PostgreSQL on docker01. scripts/postgresql/apply_declared.sh makes the server match this
# file (run it with --dry-run first), scripts/postgresql/export_declared.sh prints the real state in this format.
#
# databases:         every database with its roles <db>_role_ro, _rw, _owner and the login <db>_owner (db_create.sh)
#   ownerPrivileges: database privileges of <db>_role_owner beyond db_create.sh, create and/or temporary. An app that
#                    makes its own schemas needs create (and temporary for its temporary tables). A privilege that is
#                    not listed is taken away again.
#   logins:          application logins <db>_<name> with the role ro, rw or owner (user_create.sh)
# people:            personal logins, one login for many databases, with ro or rw per database (person_grant.sh).
#                    Only with this key the script removes access: a person or a database that is missing here is
#                    taken away from the login. Leave the key out and personal logins stay as they are. There is no
#                    personal login on docker01 yet, so the key is left out until the first one is declared.
# removed:           what the timer deletes for good after a merge: databases: [<db>] (with all data, roles and logins) and
#                    logins: {<db>: [<name>]} (the login <db>_<name> with its password in Vault). Nothing else is ever
#                    deleted. A name must not be declared and removed at once. Entries may be deleted once they ran.
#
# The state of docker01 as exported on 2026-11-01, plus the database of the Developer Portal.
databases:
  edgerunner: {}
  er_launcher_dev: {}
  metabase:
    # Metabase initializes the trusted citext extension during its first DB migration.
    ownerPrivileges: [create]
  edgerunner_balance:
    logins:
      writer: rw
      metabase: ro
  developer_portal:
    # Backstage creates one schema per plugin (backend.database.ensureSchemaExists) and the catalog uses temporary tables
    ownerPrivileges: [create, temporary]
  forgejo: {}
  fw_chaos: {}
  fw_chaos_dev: {}
  harbor: {}
  keycloak: {}
