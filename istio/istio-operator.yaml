# Input for `istioctl install -f istio/istio-operator.yaml` (see docs/kubernetes.md, "Istio installation").
# Istio is installed by hand and stays outside ArgoCD. This file is not applied to the
# cluster by itself, it only keeps the settings that a plain `istioctl install` would reset.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: installed-state
  namespace: istio-system
spec:
  profile: default
  meshConfig:
    # The provider only exists here, the Telemetry resource in kubernetes/infra/kubectl/kube-istio-telemetry.yaml
    # switches it on. Tempo takes the spans as OTLP/gRPC.
    extensionProviders:
      - name: tempo
        opentelemetry:
          service: tempo.tempo.svc.cluster.local
          port: 4317
  components:
    pilot:
      k8s:
        # istiod: 7 days at most 274 MiB and 0.035 cores. The profile requests 500m and 2048Mi, which is more than
        # the limit here, so the requests are set to 0 like for the other platform apps.
        resources:
          requests:
            cpu: 0
            memory: 0
          limits:
            cpu: 1000m
            memory: 1Gi
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            # Keeps the client's source address. A plain `istioctl install` sets the
            # Service back to Cluster, which hides the real client IP from the apps.
            externalTrafficPolicy: Local
