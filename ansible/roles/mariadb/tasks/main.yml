---
- name: Install mariadb-server
  apt:
    name: mariadb-server
    state: present
    update_cache: yes

- name: Configure bind-address in 50-server.cnf
  lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address.*'
    line: "bind-address            = {{ mariadb_bind_address }}"
  notify: restart mariadb

# Events are off by default. The audit log of scripts/mariadb/audit_setup.sh adds and drops its
# partitions with a daily event.
- name: Enable the event scheduler
  copy:
    dest: /etc/mysql/mariadb.conf.d/60-event-scheduler.cnf
    content: |
      [mysqld]
      event_scheduler = ON
    owner: root
    group: root
    mode: "0644"
  notify: restart mariadb

- name: Ensure MariaDB service is enabled and running
  service:
    name: mariadb
    state: started
    enabled: true

- name: Tune the kernel and service limits for MariaDB
  ansible.builtin.include_role:
    name: database_tuning
  vars:
    database_tuning_name: mariadb
    database_tuning_unit: mariadb.service
    database_tuning_service: mariadb
