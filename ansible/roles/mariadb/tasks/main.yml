---
- name: Install mariadb-server
  apt:
    name: mariadb-server
    state: present
    update_cache: yes

# Debian 13 ships no 50-server.cnf, so the settings live in their own file in mariadb.conf.d.
# event_scheduler: events are off by default, the audit log of scripts/mariadb/audit_setup.sh
# adds and drops its partitions with a daily event.
- name: Configure MariaDB (bind-address, event scheduler)
  copy:
    dest: /etc/mysql/mariadb.conf.d/60-gitops.cnf
    content: |
      [mysqld]
      bind-address = {{ mariadb_bind_address }}
      event_scheduler = ON
    owner: root
    group: root
    mode: "0644"
  notify: restart mariadb

- name: Ensure MariaDB service is enabled and running
  service:
    name: mariadb
    state: started
    enabled: true

- name: Tune the kernel and service limits for MariaDB
  ansible.builtin.include_role:
    name: database_tuning
  vars:
    database_tuning_name: mariadb
    database_tuning_unit: mariadb.service
    database_tuning_service: mariadb
