---
- name: Install prerequisite packages for NetBird repository
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Check for the NetBird keyring
  stat:
    path: /usr/share/keyrings/netbird-archive-keyring.gpg
  register: netbird_keyring

# The key is only needed to build the keyring, and get_url reports a change in check mode even when
# the file exists, so it only runs while the keyring is missing
- name: Download NetBird GPG key
  get_url:
    url: "https://pkgs.netbird.io/debian/public.key"
    dest: /tmp/netbird-public.key
    mode: "0644"
  when: not netbird_keyring.stat.exists

- name: Dearmor NetBird GPG key
  command: gpg --dearmor --yes --output /usr/share/keyrings/netbird-archive-keyring.gpg /tmp/netbird-public.key
  args:
    creates: /usr/share/keyrings/netbird-archive-keyring.gpg

- name: Add NetBird apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main"
    filename: netbird
    state: present
    update_cache: yes

- name: Install NetBird package
  apt:
    name: netbird
    state: present

- name: Ensure NetBird service is enabled and running
  ansible.builtin.systemd:
    name: netbird
    state: started
    enabled: true
    daemon_reload: yes

- name: Check current NetBird connection status
  command: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false
  check_mode: false

# The setup key is a one-time secret, so the join stays a manual step and no secret lives in Git.
# The firewall role only enables UFW once the host is connected.
- name: Warn that the host has not joined the NetBird network yet
  ansible.builtin.debug:
    msg: >-
      This host is not connected to NetBird. Join it once by hand:
      netbird up --setup-key <one-time key from the dashboard>
      {{ ('--management-url ' + netbird_management_url) if netbird_management_url | length > 0 else '' }}
  when: "'Management: Connected' not in netbird_status.stdout"
