---
- name: Install prerequisite packages for NetBird repository
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Download NetBird GPG key
  get_url:
    url: "https://pkgs.netbird.io/debian/public.key"
    dest: /tmp/netbird-public.key
    mode: "0644"

- name: Dearmor NetBird GPG key
  command: gpg --dearmor --yes --output /usr/share/keyrings/netbird-archive-keyring.gpg /tmp/netbird-public.key
  args:
    creates: /usr/share/keyrings/netbird-archive-keyring.gpg

- name: Add NetBird apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main"
    filename: netbird
    state: present
    update_cache: yes

- name: Install NetBird package
  apt:
    name: netbird
    state: present

- name: Ensure NetBird service is enabled and running
  ansible.builtin.systemd:
    name: netbird
    state: started
    enabled: true
    daemon_reload: yes

- name: Check current NetBird connection status
  command: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false

- name: Ensure netbird_setup_key is provided
  ansible.builtin.assert:
    that:
      - netbird_setup_key | length > 0
    fail_msg: "netbird_setup_key must be set (e.g. via --extra-vars) to join the NetBird network."
  when: "'Management: Connected' not in netbird_status.stdout"

- name: Join NetBird network
  command: >-
    netbird up --setup-key {{ netbird_setup_key }}
    {{ ('--management-url ' + netbird_management_url) if netbird_management_url | length > 0 else '' }}
  when: "'Management: Connected' not in netbird_status.stdout"
  no_log: true
