---
# install_recommends: no keeps the IPMI/Mellanox/NVMe/SMART tooling (and its timers)
# out; they are only recommended packages and useless on a VM.
- name: Install node_exporter via apt
  apt:
    name: "{{ node_exporter_package_name }}"
    state: present
    update_cache: yes
    install_recommends: no
  notify: restart node_exporter

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The Debian package reads the command line arguments from ARGS in this file
- name: Enable the textfile collector
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="--collector.textfile.directory={{ node_exporter_textfile_dir }} --collector.filesystem.mount-points-exclude={{ node_exporter_mount_points_exclude }}"'
    create: true
    mode: "0644"
  notify: restart node_exporter

# Right after the apt run systemd may not know the new unit yet, so the first try
# can fail with "Could not find the requested service". Retry a few times.
- name: Ensure node_exporter service is enabled and running
  ansible.builtin.systemd:
    name: "{{ node_exporter_service_name }}"
    state: started
    enabled: true
    daemon_reload: yes
  register: node_exporter_service
  retries: 3
  delay: 3
  until: node_exporter_service is succeeded

- name: Install the script that writes the update state of the host
  ansible.builtin.copy:
    src: node-update-status.sh
    dest: /usr/local/bin/node-update-status.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the service that runs the script
  ansible.builtin.template:
    src: node-update-status.service.j2
    dest: /etc/systemd/system/node-update-status.service
    owner: root
    group: root
    mode: "0644"
  register: node_update_status_service

- name: Install the timer
  ansible.builtin.template:
    src: node-update-status.timer.j2
    dest: /etc/systemd/system/node-update-status.timer
    owner: root
    group: root
    mode: "0644"
  register: node_update_status_timer

- name: Reload systemd after the units changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: node_update_status_service is changed or node_update_status_timer is changed

# In check mode on a new host the unit file does not exist yet, so enabling it would fail
- name: Ensure the update state timer is enabled and running
  ansible.builtin.systemd:
    name: node-update-status.timer
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
