---
# Disk usage per local-path volume of the k3s node, see files/node-pvc-usage.sh
- name: Install the script that writes the disk usage of the volumes
  ansible.builtin.copy:
    src: node-pvc-usage.sh
    dest: /usr/local/bin/node-pvc-usage.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the service that runs the script
  ansible.builtin.template:
    src: node-pvc-usage.service.j2
    dest: /etc/systemd/system/node-pvc-usage.service
    owner: root
    group: root
    mode: "0644"
  register: node_pvc_usage_service

- name: Install the timer
  ansible.builtin.template:
    src: node-pvc-usage.timer.j2
    dest: /etc/systemd/system/node-pvc-usage.timer
    owner: root
    group: root
    mode: "0644"
  register: node_pvc_usage_timer

- name: Reload systemd after the units changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: node_pvc_usage_service is changed or node_pvc_usage_timer is changed

# In check mode on a new host the unit file does not exist yet, so enabling it would fail
- name: Ensure the volume usage timer is enabled and running
  ansible.builtin.systemd:
    name: node-pvc-usage.timer
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
