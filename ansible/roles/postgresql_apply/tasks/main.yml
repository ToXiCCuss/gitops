---
- name: Check that the repository checkout with apply_declared.sh exists
  ansible.builtin.stat:
    path: "{{ postgresql_apply_repository_dir }}/scripts/postgresql/apply_declared.sh"
  register: postgresql_apply_script

- name: Fail when apply_declared.sh is not at postgresql_apply_repository_dir
  ansible.builtin.assert:
    that: postgresql_apply_script.stat.exists
    fail_msg: "{{ postgresql_apply_repository_dir }}/scripts/postgresql/apply_declared.sh is missing: check out the repository there or set postgresql_apply_repository_dir"

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ postgresql_apply_metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the service that runs apply_declared.sh
  ansible.builtin.template:
    src: postgresql-apply.service.j2
    dest: /etc/systemd/system/postgresql-apply.service
    owner: root
    group: root
    mode: "0644"
  register: postgresql_apply_service

- name: Install the timer
  ansible.builtin.template:
    src: postgresql-apply.timer.j2
    dest: /etc/systemd/system/postgresql-apply.timer
    owner: root
    group: root
    mode: "0644"
  register: postgresql_apply_timer

- name: Reload systemd after the units changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: postgresql_apply_service is changed or postgresql_apply_timer is changed

# In check mode on a new host the unit file does not exist yet, so enabling it would fail
- name: Ensure the timer is enabled and running
  ansible.builtin.systemd:
    name: postgresql-apply.timer
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
