---
# Directory on the host that holds the compose project. The data volumes in
# docker-compose.yml point at absolute paths below this path, so the data lives
# here regardless of where compose is started from. An Arcane started via
# docker/arcane/start.sh uses the repository checkout as its project directory
# instead - the role refuses to run in that case until the old stack is stopped.
arcane_dir: /root/docker/arcane

# Public URL of this instance. Differs per host, so it is resolved from
# host_config in group_vars/all/main.yml - set it there, not here.
arcane_app_url: ""

# Secrets, resolved from the vault (group_vars/all/secrets.yml).
# Set them with: scripts/ansible/setup-secrets.sh --scope <hostname>
#
# IMPORTANT on an existing installation: copy the values out of the running
# /root/docker/arcane/override.env instead of generating new ones.
# ENCRYPTION_KEY decrypts Arcane's stored data - a new key makes it unreadable.
arcane_encryption_key: ""
arcane_jwt_secret: ""

# Compose project inside this repository. The compose file is copied verbatim
# (not templated) so Renovate keeps updating the pinned image digest in
# docker/arcane/docker-compose.yml.
arcane_compose_src: "{{ playbook_dir }}/../docker/arcane"

# Image pull policy handed to docker compose (always, missing, never, policy).
arcane_pull: missing
