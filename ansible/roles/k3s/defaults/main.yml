---
# Pinned k3s release (https://github.com/k3s-io/k3s/releases). Changing it upgrades the node
# on the next run and restarts k3s.
k3s_version: "v1.37.1+k3s1"

# Fixed address of the node (node-ip), on a dummy interface. The public IP of the host may change without
# touching the cluster. Pick an address that no other network uses (pods 10.42.0.0/16, services 10.43.0.0/16,
# NetBird 100.67.0.0/16). A changed node-ip needs the etcd reset, see docs/ansible.md "Change the node address".
k3s_node_ip: 10.254.0.1
k3s_node_interface: dummy0

# Kernel settings the kubelet expects (/etc/sysctl.d/90-kubelet.conf). Without
# protect-kernel-defaults the kubelet sets them itself on start; writing them here makes
# them persistent and independent of the kubelet.
k3s_kernel_sysctls:
  vm.overcommit_memory: 1
  vm.panic_on_oom: 0
  kernel.panic: 10
  kernel.panic_on_oops: 1

# Content of /etc/rancher/k3s/config.yaml: every k3s server flag as a key, merged over node-ip.
# Set per host in host_config (group_vars/all/main.yml).
k3s_config: {}
