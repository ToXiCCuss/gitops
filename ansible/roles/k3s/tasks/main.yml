---
- name: Set the kernel parameters the kubelet expects
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubelet.conf
    state: present
    reload: true
  loop: "{{ k3s_kernel_sysctls | dict2items }}"

# The unit creates the dummy interface with the node-ip before every start of k3s.
- name: Install the unit that holds the fixed node address
  ansible.builtin.template:
    src: k3s-node-address.service.j2
    dest: /etc/systemd/system/k3s-node-address.service
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_address_unit
  tags: [k3s, k3s_node_address]

- name: Reload systemd after the node address unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: k3s_node_address_unit is changed
  tags: [k3s, k3s_node_address]

# In check mode on a new host the unit file does not exist yet, so enabling it would fail
- name: Ensure the node address exists and is enabled
  ansible.builtin.systemd:
    name: k3s-node-address.service
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [k3s, k3s_node_address]

# Both checks only read, so they also run in check mode and the dry run is accurate.
- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false
  check_mode: false

# A node installed with flags still carries them in the systemd unit. The install script
# rewrites the unit without flags, they live in config.yaml.
- name: Check whether the systemd unit still carries server flags
  ansible.builtin.command:
    argv: [grep, -q, "^[[:space:]]*'--", /etc/systemd/system/k3s.service]
  register: k3s_unit_flags
  changed_when: false
  failed_when: false
  check_mode: false

# SKIP_START: a running k3s keeps its old flags until the handler restarts it once,
# after config.yaml is in place.
- name: Install or upgrade k3s
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout or k3s_unit_flags.rc == 0
  block:
    - name: Download the k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"

    - name: Run the k3s install script
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
        INSTALL_K3S_SKIP_START: "true"
      notify: restart k3s

- name: Make sure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# k3s does not survive a changed node-ip on its own: the embedded etcd keeps the old peer address and k3s
# restarts in a loop. The role therefore refuses to rewrite it, the change is a manual procedure.
- name: Read the current config.yaml
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/config.yaml
  register: k3s_config_current
  failed_when: false

- name: Refuse to change the node-ip of an existing node
  ansible.builtin.assert:
    that:
      - (k3s_config_current.content | b64decode | from_yaml | default({}, true)).get('node-ip', k3s_node_ip) == k3s_node_ip
    fail_msg: "The node-ip in /etc/rancher/k3s/config.yaml differs from k3s_node_ip ({{ k3s_node_ip }}). k3s does not start with a changed node-ip: follow docs/ansible.md, section 'Change the node address'."
  when: k3s_config_current.content is defined

- name: Write config.yaml
  ansible.builtin.copy:
    content: "{{ {'node-ip': k3s_node_ip} | combine(k3s_config) | to_nice_yaml }}"
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: restart k3s

- name: Ensure the k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
