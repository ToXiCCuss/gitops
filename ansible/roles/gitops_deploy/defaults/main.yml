---
# Checkout of this repository on the host. The timer runs deploy.sh from here, after a git pull.
gitops_deploy_repository_dir: /root/gitops

# When the runs start (systemd calendar event, local time of the host): hourly from 08:00 to 20:00.
# There is no run at night and none after a boot outside this window. The DockerDeployStale alert
# (kubernetes/monitoring/kubectl/alert-rules.yaml) knows this window, change both together.
gitops_deploy_calendar: "*-*-* 08..20:00:00"

# Textfile collector directory of the node_exporter (the same as node_exporter_textfile_dir in the
# node_exporter role). deploy.sh leaves the result of every run there, Prometheus alerts on it.
gitops_deploy_metrics_dir: /var/lib/prometheus/node-exporter
