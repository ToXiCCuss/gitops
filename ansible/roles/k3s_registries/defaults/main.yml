---
# Harbor host that acts as pull-through cache for the mirrored registries.
# The proxy-cache projects are public, so k3s pulls without credentials.
k3s_registries_harbor_host: harbor.k8sdev.rjst.de

# Upstream registries mirrored through Harbor. Each needs a public Harbor proxy-cache
# project with exactly this name (docker.io, ghcr.io, ...).
k3s_registries_mirrored:
  - docker.io
  - ghcr.io

# systemd unit to restart when the config changes ("k3s" on servers, "k3s-agent" on agents).
k3s_registries_service_name: k3s
