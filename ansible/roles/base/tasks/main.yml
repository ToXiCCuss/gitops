---
- name: Install required system packages
  apt:
    name:
      - unattended-upgrades
      - needrestart
      - jq
      - curl
      - btop
      - iotop-c
      - ncdu
      - iptraf-ng
      - ufw

    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

# --- Unattended Upgrades ---
- name: Configure Unattended-Upgrades
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
  when: unattended_upgrades_enabled

- name: Enable automatic update checks
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  when: unattended_upgrades_enabled

# --- SSH hardening (key-only) ---
- name: Deploy SSH public keys for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ ssh_authorized_keys | join('\n') }}"
    exclusive: "{{ ssh_authorized_keys_exclusive }}"
  when: ssh_authorized_keys | length > 0

# 00- prefix: sshd uses the first value found, so this must win over
# e.g. 50-cloud-init.conf which may set PasswordAuthentication yes
- name: Disable SSH password authentication
  copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      AuthenticationMethods publickey
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_authorized_keys | length > 0
  notify: restart sshd
