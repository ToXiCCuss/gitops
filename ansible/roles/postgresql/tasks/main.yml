---
- name: Install postgresql-common
  apt:
    name:
      - postgresql-common
      - sudo
    state: present
    update_cache: yes

# Debian 13 writes pgdg.sources (older releases pgdg.list); a wrong name here makes the script run every time
- name: Add official PGDG repository
  command: /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
  args:
    creates: /etc/apt/sources.list.d/pgdg.sources

- name: Install PostgreSQL and extensions
  apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-{{ postgresql_version }}-cron"
      - "postgresql-{{ postgresql_version }}-partman"
    state: present
    update_cache: yes

# pg_cron only works when it is preloaded (restart needed). scripts/postgresql/audit_setup.sh
# schedules the partition maintenance of the audit log with it.
- name: Configure shared_preload_libraries
  lineinfile:
    path: "{{ postgresql_conf }}"
    regexp: '^#?shared_preload_libraries\s*='
    line: "shared_preload_libraries = 'pg_cron,pg_partman_bgw,pg_stat_statements'"
  notify: restart postgresql

- name: Configure listen_addresses
  lineinfile:
    path: "{{ postgresql_conf }}"
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '*'"
  notify: restart postgresql

- name: Allow external access in pg_hba.conf
  lineinfile:
    path: "{{ postgresql_hba_conf }}"
    line: "host    all             all             0.0.0.0/0               scram-sha-256"
  notify: restart postgresql

- name: Ensure PostgreSQL service is enabled and running
  service:
    name: postgresql
    state: started
    enabled: true

- name: Tune the kernel and service limits for PostgreSQL
  ansible.builtin.include_role:
    name: database_tuning
  vars:
    database_tuning_name: postgresql
    database_tuning_unit: postgresql@.service
    database_tuning_service: postgresql
