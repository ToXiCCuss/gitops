---
# Ports to allow in UFW, one entry per rule:
#   comment (required), port + proto (optional, default: every port), from_ip (optional, default: any)
#   A rule without port and proto opens everything for from_ip (e.g. the k3s pod CIDR).
# Set per host in host_config (group_vars/all/main.yml). Incoming traffic that
# matches none of them is denied.
firewall_rules: []
