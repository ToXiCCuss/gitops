---
docker_hosts:
   - docker01

mariadb_hosts:
   - docker01

# Needs MariaDB on the same host (local socket), so only hosts from mariadb_hosts
mariadb_exporter_hosts:
   - docker01

postgresql_hosts:
   - docker01

# Applies databases/postgresql.yaml regularly (systemd timer). Needs PostgreSQL on the same host and the AppRole of
# the database scripts in Vault, so only hosts from postgresql_hosts
postgresql_apply_hosts:
   - docker01

# Needs PostgreSQL on the same host (local socket), so only hosts from postgresql_hosts
postgres_exporter_hosts:
   - docker01

# The exporter on the host replaces the node-exporter pod of the Prometheus stack on k8sdev01 (it writes the
# textfile metrics there too, see docs/ansible.md: Node exporter and update monitoring)
node_exporter_hosts:
   - docker01
   - k8sdev01

# Runs deploy.sh regularly (systemd timer). Needs the Docker projects and Vault, so only Docker hosts
gitops_deploy_hosts:
   - docker01

# Hosts with a UFW policy (default deny incoming, rules from host_config).
# k8sdev01 only allows the k3s pod and service CIDRs: it is reached through NetBird, everything else is denied.
firewall_hosts:
   - docker01
   - k8sdev01

# The client is installed here, the join is manual (netbird up --setup-key ...). Hosts in
# this list only get an active firewall once they are connected to NetBird.
netbird_hosts:
   - k8sdev01
   - docker01

# SSH public keys for root (key-only login, password login gets disabled)
ssh_authorized_keys:
   - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ557k6uQaq3TV0Li8Y3+S3tOgQUPU6y0IM8E/TWSJGA robert@pc"

# k3s nodes installed by the k3s role (flags in host_config).
k3s_hosts:
   - k8sdev01

# ── Per-host configuration (plain, NOT secret) ───────────────────────────────
# Non-confidential settings that differ per host: an entry under the hostname wins
# over the one under "all".
host_config:
  all: {}
  docker01:
    firewall_rules:
      - { port: 80,    proto: tcp, comment: "NetBird server (HTTP)" }
      - { port: 443,   proto: tcp, comment: "NetBird server (HTTPS)" }
      - { port: 3478,  proto: udp, comment: "NetBird server (STUN/TURN)" }
      - { port: 51820, proto: udp, comment: "WireGuard" }
      - { port: 2456,  proto: udp, comment: "Game server (Pelican)" }
      - { port: 2457,  proto: udp, comment: "Game server (Pelican)" }
      - { port: 2458,  proto: udp, comment: "Game server (Pelican)" }
      - { port: 15636, proto: udp, comment: "Enshrouded game server" }
      - { port: 15637, proto: udp, comment: "Enshrouded query (Steam)" }
      - { port: 5432,  proto: tcp, from_ip: 172.16.0.0/12, comment: "PostgreSQL from the Docker networks" }
      - { port: 3306,  proto: tcp, from_ip: 172.16.0.0/12, comment: "MariaDB from the Docker networks" }
      - { port: 9000,  proto: tcp, from_ip: 172.16.0.0/12, comment: "RustFS S3 from the Docker networks" }
  k8sdev01:
    # Only reached through NetBird, but UFW also filters what the pods send to the host
    # (e.g. the Kubernetes service address of the API server). docs.k3s.io asks for both CIDRs.
    firewall_rules:
      - { from_ip: 10.42.0.0/16, comment: "k3s pod CIDR" }
      - { from_ip: 10.43.0.0/16, comment: "k3s service CIDR" }
      - { port: 80,  proto: tcp, comment: "Public ingress gateway (HTTP, redirects to HTTPS)" }
      - { port: 443, proto: tcp, comment: "Public ingress gateway (HTTPS)" }
    k3s_config:
      cluster-init: true
      flannel-backend: wireguard-native
      disable:
        - traefik
      kube-controller-manager-arg:
        - bind-address=0.0.0.0
      kube-proxy-arg:
        - metrics-bind-address=0.0.0.0
      kube-scheduler-arg:
        - bind-address=0.0.0.0
      etcd-expose-metrics: true

# ── Resolution helpers ───────────────────────────────────────────────────────
# Merge the "all" layer with the current host's layer once; host entries win.
# Defined here so every variable below stays a readable one-liner.
#
# Why not host_vars/? inventory.ini only knows "localhost", and Ansible resolves
# host_vars/ by inventory name - host_vars/docker01.yml would never be loaded.
# ansible_hostname is a fact and holds the real hostname, which is also what the
# *_hosts gates above compare against. The fallback to inventory_hostname keeps
# the lookups working if facts were not gathered.
_scope_host: "{{ ansible_hostname | default(inventory_hostname) }}"
_config: "{{ (host_config | default({})).get('all', {}) | combine((host_config | default({})).get(_scope_host, {})) }}"

# ── Per-host settings resolved from host_config ──────────────────────────────
firewall_rules: "{{ _config['firewall_rules'] | default([]) }}"
k3s_config: "{{ _config['k3s_config'] | default({}) }}"
