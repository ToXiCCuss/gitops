---
- name: Base configuration on all servers
  hosts: all
  become: true
  roles:
    - base

# Puts the host into one group per role that applies to it (has_<role>, from the
# <role>_hosts lists in group_vars/all/main.yml). The plays below only run on their group,
# so a role that does not apply shows as one skipped play instead of one line per task.
# Needs the facts (ansible_hostname) of the play above.
- name: Sort the host into the groups of the roles that apply to it
  hosts: all
  tags: always
  tasks:
    - name: Add the host to a group per role
      ansible.builtin.group_by:
        key: "has_{{ item }}"
      loop:
        - netbird
        - firewall
        - node_exporter
        - docker
        - gitops_deploy
        - mariadb
        - mariadb_exporter
        - postgresql
        - postgres_exporter
        - mongodb
        - k3s
      when: ansible_hostname in lookup('vars', item ~ '_hosts')

# Before the firewall: the host joins NetBird first, so it stays reachable once UFW denies
# everything that is not allowed.
- name: Install NetBird
  hosts: has_netbird
  become: true
  roles:
    - netbird

- name: Configure the firewall
  hosts: has_firewall
  become: true
  roles:
    - role: firewall
      tags: firewall

- name: Install Node Exporter
  hosts: has_node_exporter
  become: true
  roles:
    - role: node_exporter
      tags: node_exporter

- name: Install Docker
  hosts: has_docker
  become: true
  roles:
    - docker

# After Docker and the node_exporter: it needs the Docker host and the textfile collector directory
- name: Deploy the Docker Compose projects regularly
  hosts: has_gitops_deploy
  become: true
  roles:
    - role: gitops_deploy
      tags: gitops_deploy

- name: Install MariaDB
  hosts: has_mariadb
  become: true
  roles:
    - mariadb

- name: Install mysqld_exporter
  hosts: has_mariadb_exporter
  become: true
  roles:
    - mariadb_exporter

- name: Install PostgreSQL
  hosts: has_postgresql
  become: true
  roles:
    - postgresql

- name: Install postgres_exporter
  hosts: has_postgres_exporter
  become: true
  roles:
    - postgres_exporter

- name: Install MongoDB
  hosts: has_mongodb
  become: true
  roles:
    - mongodb

- name: Install k3s
  hosts: has_k3s
  become: true
  roles:
    - role: k3s
      tags: k3s

- name: Configure Harbor pull-through mirrors for k3s
  hosts: has_k3s
  become: true
  roles:
    - k3s_registries
