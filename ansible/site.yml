---
- name: Base configuration on all servers
  hosts: all
  become: true
  roles:
    - base

- name: Install Node Exporter (only on hosts listed in node_exporter_hosts)
  hosts: all
  become: true
  roles:
    - role: node_exporter
      when: ansible_hostname in node_exporter_hosts

- name: Install Docker (only on hosts listed in docker_hosts)
  hosts: all
  become: true
  roles:
    - role: docker
      when: ansible_hostname in docker_hosts

# After Docker: the role closes Docker ports in DOCKER-USER, which Docker creates.
- name: Configure the firewall (only on hosts listed in firewall_hosts)
  hosts: all
  become: true
  roles:
    - role: firewall
      when: ansible_hostname in firewall_hosts
      tags: firewall

- name: Install MariaDB (only on hosts listed in mariadb_hosts)
  hosts: all
  become: true
  roles:
    - role: mariadb
      when: ansible_hostname in mariadb_hosts

- name: Install PostgreSQL (only on hosts listed in postgresql_hosts)
  hosts: all
  become: true
  roles:
    - role: postgresql
      when: ansible_hostname in postgresql_hosts

- name: Install MongoDB (only on hosts listed in mongodb_hosts)
  hosts: all
  become: true
  roles:
    - role: mongodb
      when: ansible_hostname in mongodb_hosts

- name: Install NetBird (only on hosts listed in netbird_hosts)
  hosts: all
  become: true
  roles:
    - role: netbird
      when: ansible_hostname in netbird_hosts

- name: Install k3s (only on hosts listed in k3s_hosts)
  hosts: all
  become: true
  roles:
    - role: k3s
      when: ansible_hostname in k3s_hosts
      tags: k3s

- name: Configure Harbor pull-through mirrors for k3s (only on hosts listed in k3s_hosts)
  hosts: all
  become: true
  roles:
    - role: k3s_registries
      when: ansible_hostname in k3s_hosts
