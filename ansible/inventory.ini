[all]
localhost ansible_connection=local

# Ob Docker installiert wird, wird NICHT hier, sondern über
# group_vars/all/main.yml (Variable "docker_hosts") gesteuert, damit die
# Konfiguration zentral über Git verwaltet werden kann.

# Filled at run time by the sorting play in site.yml (group_by). Declared here so that the
# plays of an empty group are skipped without the warning "Could not match supplied host pattern".
[has_netbird]
[has_firewall]
[has_node_exporter]
[has_docker]
[has_gitops_deploy]
[has_mariadb]
[has_mariadb_exporter]
[has_postgresql]
[has_postgres_exporter]
[has_mongodb]
[has_k3s]
